<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ตารางสอน & ระบบบัญชีติวเตอร์ (Minimal Suite)</title>

<!-- PWA: installability + home screen appearance -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#52796F">
<meta name="background-color" content="#F1F3F5">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ตารางติวเตอร์">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<!-- html2canvas for image export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --bg-page: #F8F9FA;
    --bg-card: #FFFFFF;
    --bg-sub: #F1F3F5;
    
    --text-primary: #212529;
    --text-secondary: #495057;
    --text-muted: #868E96;
    
    --border-color: #E9ECEF;
    --border-dark: #DEE2E6;
    
    --accent-sage: #52796F;
    --accent-sage-light: #E8F0EC;
    --accent-amber: #D97706;
    --accent-amber-light: #FEF3C7;
    --accent-rose: #E11D48;
    --accent-rose-light: #FFE4E6;
    
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
    --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.06);

    --font-body: 'Mali', system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;

    --bottom-nav-h: 64px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background-color: var(--bg-page);
    color: var(--text-primary);
    font-family: var(--font-body);
    min-height: 100vh;
    padding-bottom: 60px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 1140px;
    margin: 0 auto;
    padding: 24px 16px;
  }

  /* Header Minimal Style */
  header.app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding-bottom: 20px;
    margin-bottom: 20px;
    border-bottom: 1.5px solid var(--border-color);
    flex-wrap: wrap;
  }
  .app-title h1 {
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 4px;
    color: var(--accent-sage);
  }
  .app-title .subtitle {
    font-size: 13.5px;
    color: var(--text-muted);
  }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .month-picker {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-card);
    padding: 4px 12px;
    border-radius: 30px;
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-sm);
  }
  .month-picker button {
    background: none; border: none; color: var(--text-primary);
    font-size: 18px; cursor: pointer; width: 28px; height: 28px;
    border-radius: 50%; display: grid; place-items: center;
    font-family: inherit;
  }
  .month-picker button:active { background: var(--bg-sub); }
  .month-picker .label {
    font-weight: 600; font-size: 14px; min-width: 130px; text-align: center;
  }

  .view-switch {
    display: flex;
    background: var(--bg-sub);
    padding: 3px;
    border-radius: 30px;
  }
  .view-switch button {
    border: none; background: transparent; padding: 6px 14px; border-radius: 30px;
    font-family: inherit; font-weight: 600; font-size: 13px;
    cursor: pointer; color: var(--text-muted); transition: all 0.2s;
  }
  .view-switch button.active {
    background: var(--bg-card); color: var(--accent-sage);
    box-shadow: var(--shadow-sm); font-weight: 700;
  }

  /* Buttons */
  .btn {
    font-family: inherit; font-size: 13.5px; font-weight: 600;
    border-radius: var(--radius-sm); padding: 10px 16px; cursor: pointer;
    border: 1px solid var(--border-dark); background: var(--bg-card);
    color: var(--text-primary); display: inline-flex; align-items: center; gap: 6px;
    transition: all 0.15s ease; text-decoration: none; min-height: 40px;
    -webkit-appearance: none; appearance: none; touch-action: manipulation;
  }
  .btn:active { background: var(--bg-sub); }
  .btn.primary {
    background: var(--accent-sage); color: #FFF; border-color: var(--accent-sage);
  }
  .btn.danger {
    background: transparent; border-color: var(--accent-rose); color: var(--accent-rose);
  }
  .btn.danger:active { background: var(--accent-rose-light); }
  .btn.small { padding: 6px 12px; font-size: 12px; min-height: 34px; }

  /* Navigation Tabs */
  nav.app-tabs {
    display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
  }
  nav.app-tabs button {
    font-family: inherit; font-weight: 600; font-size: 13.5px;
    background: var(--bg-card); color: var(--text-muted);
    border: 1px solid var(--border-color); padding: 10px 18px;
    border-radius: var(--radius-md); cursor: pointer; transition: all 0.15s;
    box-shadow: var(--shadow-sm); -webkit-appearance: none;
  }
  nav.app-tabs button.active {
    background: var(--accent-sage); color: #FFF; border-color: var(--accent-sage);
    font-weight: 700;
  }

  /* Bottom mobile tab bar: hidden on desktop, shown via media query */
  nav.app-tabs-mobile {
    display: none;
  }

  /* Main Container Panel */
  .panel-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 24px;
    box-shadow: var(--shadow-md);
    min-height: 480px;
  }
  .panel-card h2 {
    font-size: 19px; font-weight: 700; margin: 0 0 6px; color: var(--text-primary);
  }
  .panel-card .hint-text {
    font-size: 13px; color: var(--text-muted); margin-bottom: 20px;
  }

  /* Stats Cards Grid */
  .stats-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px; margin-bottom: 24px;
  }
  .stat-card {
    background: var(--bg-sub); border: 1px solid var(--border-color);
    border-radius: var(--radius-md); padding: 14px 16px;
  }
  .stat-card .val {
    font-size: 22px; font-weight: 700; color: var(--accent-sage); font-family: var(--font-mono);
  }
  .stat-card .lbl {
    font-size: 12px; color: var(--text-muted); margin-top: 2px;
  }

  /* Section Titles */
  .section-title {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    margin: 24px 0 12px; border-bottom: 2px solid var(--bg-sub); padding-bottom: 8px; flex-wrap: wrap;
  }
  .section-title h3 { font-size: 16px; font-weight: 700; margin: 0; }

  /* Calendar Grid / Columns */
  .grid-columns {
    display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px;
    -webkit-overflow-scrolling: touch;
  }
  .day-column {
    flex: 1 1 0; min-width: 160px; background: var(--bg-sub);
    border: 1px solid var(--border-color); border-radius: var(--radius-md); overflow: hidden;
  }
  .day-header {
    background: var(--accent-sage); color: #FFF; padding: 10px; text-align: center;
  }
  .day-header .d-name { font-weight: 700; font-size: 15px; }
  .day-header .d-count { font-size: 11px; opacity: 0.85; font-family: var(--font-mono); }
  .day-body { padding: 8px; display: flex; flex-direction: column; gap: 8px; min-height: 120px; }

  /* Time Slot Cards */
  .slot-card {
    border-radius: var(--radius-sm); padding: 10px; cursor: pointer;
    transition: all 0.15s ease; border: 1px solid var(--border-color);
    background: var(--bg-card); position: relative;
    -webkit-user-select: none; user-select: none;
  }
  .slot-card[draggable="true"] { cursor: grab; }
  .slot-card:active { transform: translateY(1px); }
  
  .slot-card .time { font-weight: 700; font-size: 12.5px; color: var(--text-primary); display: block; font-family: var(--font-mono); }
  .slot-card .badge { font-size: 10px; color: var(--text-muted); display: block; margin-bottom: 4px; }
  
  .slot-card.available { background: var(--accent-sage-light); border-color: #C2E0D4; }
  .slot-card.available .status { font-weight: 700; font-size: 12px; color: var(--accent-sage); }
  
  .slot-card.booked { background: var(--accent-amber-light); border-color: #FDE68A; }
  .slot-card.booked .status { font-size: 10.5px; font-weight: 700; color: var(--accent-amber); display: block; }
  .slot-card.booked .hc { font-weight: 700; font-size: 13px; color: #92400E; display: block; font-family: var(--font-mono); }
  .slot-card.booked .subj {
    font-size: 11.5px; font-weight: 600; color: #78350F; display: block;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .slot-card.booked .students {
    font-size: 10.5px; color: #A16207; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
  }
  .slot-card .price { font-size: 11px; color: var(--text-muted); display: block; margin-top: 4px; font-family: var(--font-mono); }

  .edit-time-btn {
    border: none; background: transparent; cursor: pointer; font-size: 12px;
    padding: 2px 4px; opacity: 0.55; vertical-align: middle; touch-action: manipulation;
  }
  .toggle-day-btn {
    border: none; background: transparent; cursor: pointer; font-size: 12px;
    opacity: 0.7; color: #FFF; padding: 4px 6px; touch-action: manipulation;
  }

  /* Day-jump chips: mobile only (shown via media query below) */
  .day-jump-nav {
    display: none;
  }
  .day-jump-chip {
    flex: 0 0 auto; scroll-snap-align: start; text-decoration: none;
    background: var(--bg-card); color: var(--text-secondary); font-weight: 700; font-size: 13px;
    border: 1px solid var(--border-color); border-radius: 30px; padding: 8px 14px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .day-jump-chip.closed { color: var(--text-muted); opacity: 0.6; }
  .day-jump-chip:active { background: var(--accent-sage-light); color: var(--accent-sage); }

  /* Student Mode Adjustments */
  body.student-mode .slot-card.booked { background: var(--accent-rose-light); border-color: #FECDD3; }
  body.student-mode .slot-card.booked .status { color: var(--accent-rose); }
  body.student-mode .slot-card.booked .hc,
  body.student-mode .slot-card.booked .subj,
  body.student-mode .slot-card.booked .students,
  body.student-mode .slot-card .price,
  body.student-mode .teacher-only { display: none !important; }
  body.student-mode .slot-card.booked .status::after { content: 'เต็มแล้ว'; }

  /* Monthly Calendar Minimal */
  .month-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
    background: var(--bg-sub); border-radius: var(--radius-md); padding: 10px;
  }
  .month-dow { text-align: center; font-size: 12px; font-weight: 700; color: var(--text-muted); padding: 4px 0; }
  .month-cell {
    background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-sm);
    min-height: 85px; padding: 6px; cursor: pointer; position: relative; transition: all 0.15s;
    -webkit-user-select: none; user-select: none;
  }
  .month-cell.empty { visibility: hidden; }
  .month-cell.blocked { background: var(--accent-rose-light); border-color: var(--accent-rose); }
  .month-cell .num { font-size: 13px; font-weight: 700; color: var(--text-secondary); font-family: var(--font-mono); }
  .month-cell.blocked .num { color: var(--accent-rose); }
  .month-cell .blocked-label { position: absolute; top: 4px; right: 6px; font-size: 10px; color: var(--accent-rose); font-weight: 700; }
  
  .chip-item {
    display: block; font-size: 10.5px; margin-top: 3px; padding: 2px 6px; border-radius: 4px;
    background: var(--accent-sage-light); color: var(--accent-sage); font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
  }
  .chip-item.absent { background: transparent; color: var(--accent-rose); text-decoration: line-through; border: 1px solid var(--accent-rose); }
  .chip-item.teacher-off { background: var(--accent-rose-light); color: var(--accent-rose); text-decoration: line-through; }
  .month-cell.blocked .chip-item.teacher-off { background: #fff; }
  .chip-item.cancelled { background: transparent; color: var(--text-muted); text-decoration: line-through; border: 1px dashed var(--border-dark); }
  .chip-item.chip-more { background: var(--bg-sub); color: var(--text-secondary); font-weight: 700; border: 1px dashed var(--border-dark); }

  /* Forms & Cards Minimal */
  .form-box {
    background: var(--bg-sub); border-radius: var(--radius-md); padding: 16px;
    margin-bottom: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px;
  }
  .form-box label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
  .form-box input, .form-box select, .form-box textarea {
    width: 100%; padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-dark);
    background: var(--bg-card); font-family: inherit; font-size: 16px; color: var(--text-primary);
    -webkit-appearance: none; appearance: none;
  }
  .form-box .full-width { grid-column: 1 / -1; }

  .item-card {
    background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md);
    padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-sm);
  }
  .item-card .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .item-card .title { font-weight: 700; font-size: 15px; color: var(--text-primary); }

  .slot-row-item {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 8px 12px; border: 1px solid var(--border-color); border-radius: var(--radius-sm);
    margin-bottom: 6px; background: var(--bg-sub); font-size: 13px; flex-wrap: wrap;
  }

  /* Billing Minimal */
  .msg-textarea {
    width: 100%; min-height: 170px; padding: 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--border-dark); background: var(--bg-sub); font-family: inherit;
    font-size: 13px; line-height: 1.6; color: var(--text-primary); resize: vertical; margin-top: 8px;
  }
  .grand-box {
    display: flex; justify-content: space-between; align-items: center; background: var(--accent-sage);
    color: #FFF; padding: 18px 24px; border-radius: var(--radius-md); margin-top: 16px;
  }
  .grand-box .num { font-size: 24px; font-weight: 700; font-family: var(--font-mono); }

  /* Modal Dialog */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none;
    align-items: center; justify-content: center; z-index: 100; padding: 16px;
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  }
  .modal-backdrop.active { display: flex; }
  .modal-box {
    background: var(--bg-card); border-radius: var(--radius-lg); max-width: 440px; width: 100%;
    padding: 24px; box-shadow: var(--shadow-md); border: 1px solid var(--border-color);
  }
  .modal-box h3 { font-size: 18px; font-weight: 700; margin: 0 0 4px; color: var(--text-primary); }
  .modal-box .time-info { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }
  .modal-field { margin-bottom: 14px; }
  .modal-field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
  .modal-field input, .modal-field textarea, .modal-field select {
    width: 100%; padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-dark);
    font-family: inherit; font-size: 16px; -webkit-appearance: none; appearance: none;
  }
  .modal-btns { display: flex; gap: 8px; margin-top: 20px; }
  .modal-btns .btn { flex: 1; justify-content: center; }

  /* Toast Notification */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--text-primary); color: #FFF; padding: 8px 20px; border-radius: 30px;
    font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    z-index: 200; box-shadow: var(--shadow-md);
  }
  .toast.show { opacity: 1; }

  /* =========================================
     MOBILE RESPONSIVE (≤720px)
     ========================================= */
  @media (max-width: 720px) {
    body { padding-bottom: calc(var(--bottom-nav-h) + env(safe-area-inset-bottom, 0px) + 16px); }
    .container { padding: 16px 12px; }

    /* Header: stack title above controls, controls spread full width */
    header.app-header {
      flex-direction: column; align-items: stretch; gap: 14px; padding-bottom: 16px; margin-bottom: 16px;
    }
    .app-title h1 { font-size: 20px; }
    .app-title .subtitle { font-size: 12.5px; }
    .header-controls { justify-content: space-between; gap: 10px; }
    .month-picker { flex: 1 1 auto; justify-content: space-between; }
    .month-picker .label { min-width: 0; font-size: 13px; }
    .month-picker button { width: 34px; height: 34px; font-size: 20px; }
    .view-switch { flex: 1 1 auto; }
    .view-switch button { flex: 1 1 0; padding: 8px 6px; font-size: 12px; }

    /* Top tab bar becomes a horizontally-scrolling pill row instead of wrapping */
    nav.app-tabs {
      flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch;
      scroll-snap-type: x proximity; margin-bottom: 16px; padding-bottom: 4px;
    }
    nav.app-tabs button {
      flex: 0 0 auto; scroll-snap-align: start; white-space: nowrap; font-size: 13px; padding: 10px 16px;
    }

    /* Bottom fixed tab bar for one-thumb navigation */
    nav.app-tabs-mobile {
      display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 90;
      background: var(--bg-card); border-top: 1px solid var(--border-color);
      box-shadow: 0 -4px 16px rgba(0,0,0,0.06);
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
      height: var(--bottom-nav-h);
    }
    nav.app-tabs-mobile button {
      flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; background: none; border: none; color: var(--text-muted); font-family: inherit;
      padding: 4px 2px; border-radius: var(--radius-sm); touch-action: manipulation;
    }
    nav.app-tabs-mobile button .ic { font-size: 19px; line-height: 1; }
    nav.app-tabs-mobile button .lb { font-size: 10px; font-weight: 700; }
    nav.app-tabs-mobile button.active { color: var(--accent-sage); background: var(--accent-sage-light); }

    .panel-card { padding: 16px; border-radius: var(--radius-md); min-height: 0; }
    .panel-card h2 { font-size: 17px; }

    /* Day-jump chip nav appears above the weekly grid on mobile */
    .day-jump-nav {
      display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch;
      scroll-snap-type: x proximity; padding-bottom: 10px; margin-bottom: 4px;
    }

    /* Weekly grid: stop side-scrolling, stack each day full-width so nothing is cut off */
    .grid-columns { flex-direction: column; overflow-x: visible; gap: 14px; }
    /* flex:0 0 auto — with the desktop "flex:1 1 0" the stacked columns collapsed to 0 height on phones */
    .day-column { min-width: 100%; flex: 0 0 auto; scroll-margin-top: 12px; }
    .day-body { padding: 10px; gap: 10px; }
    .slot-card { padding: 12px; }
    .slot-card .subj, .slot-card .students {
      white-space: normal; overflow: visible; text-overflow: unset;
    }
    .edit-time-btn, .toggle-day-btn { padding: 6px 8px; font-size: 14px; }

    /* Monthly calendar: tighten grid, allow names to wrap onto 2 lines instead of vanishing */
    .month-grid { gap: 4px; padding: 6px; }
    .month-cell { min-height: 74px; padding: 4px; }
    .month-dow { font-size: 10.5px; padding: 2px 0; }
    .chip-item {
      font-size: 9.5px; padding: 2px 4px; white-space: normal; overflow: visible;
      text-overflow: unset; display: block; line-height: 1.25;
    }

    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .grand-box { flex-direction: column; align-items: flex-start; gap: 6px; }

    /* Modal: fill more of the screen, keep controls reachable */
    .modal-box { max-width: 100%; padding: 20px; }
    .modal-btns { flex-wrap: wrap; }
    .modal-btns .btn { flex: 1 1 100%; }

    .form-box { grid-template-columns: 1fr; }
  }

  @media print {
    .header-controls, nav.app-tabs, nav.app-tabs-mobile, .btn, .stats-grid { display: none !important; }
    body { background: #fff !important; }
    .panel-card { box-shadow: none; border: none; padding: 0; }
  }

  /* ===== v3 additions ===== */
  .sync-pill {
    font-size: 11.5px; font-weight: 700; padding: 6px 12px; border-radius: 30px; cursor: pointer;
    border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-muted);
    font-family: inherit; white-space: nowrap;
  }
  .sync-pill.ok { color: var(--accent-sage); border-color: #C2E0D4; background: var(--accent-sage-light); }
  .sync-pill.dirty { color: var(--accent-amber); border-color: #FDE68A; background: var(--accent-amber-light); }
  .sync-pill.err { color: var(--accent-rose); border-color: #FECDD3; background: var(--accent-rose-light); }

  .banner {

  .gh-form input {
    width: 100%; padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-dark);
    font-family: var(--font-mono); font-size: 13px;
  }
  .gh-form label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }

  /* Mini schedule card (PNG for LINE) */
  .card-modal-box { max-width: 520px; }
  .card-preview {
    width: 100%; border-radius: var(--radius-md); border: 1px solid var(--border-color);
    background: var(--bg-sub); min-height: 240px; display: grid; place-items: center; overflow: hidden; margin: 10px 0 4px;

  @media (max-width: 720px) {

</style>

<!-- Toast -->
<div class="toast" id="toast">บันทึกข้อมูลเรียบร้อย</div>

<script src="./js/core.js"></script>
<script src="./js/card.js"></script>
<script>
'use strict';
/* =========================================
   Tutor schedule UI (v3)
   - Data source of truth: data.json in the GitHub repo (Claude can edit it directly).
   - Edits made here are kept in this browser until pushed to GitHub (tab "เซฟ & ซิงก์").
   - Business logic lives in js/core.js (tested with `npm test`).
   ========================================= */
const C = window.TutorCore;
const TH_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const DOW_NAMES = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const DOW_LABEL = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสฯ','ศุกร์','เสาร์'];
const DOW_SHORT = ['อา','จ','อ','พ','พฤ','ศ','ส'];
const WEEKDAY_DOWS = [1, 2, 3, 4, 5];
const WEEKEND_DOWS = [6, 0];

const LS_KEY = 'tutor_schedule_v3';          // {state, baseRev, dirty}
const LS_OLD = 'tutor_minimal_schedule_v2';  // data saved by the previous version of this app
const LS_OLD_DONE = 'tutor_v2_import_done';
const LS_GH = 'tutor_github_sync';           // {token, repo, branch, path}
const LS_VIEW = 'tutor_view';

let S = C.emptyState();
const sync = { baseRev: 0, dirty: false, conflict: null, oldLocal: null, error: null, loaded: false };

const pad = (n) => String(n).padStart(2, '0');
const today = new Date();
let view = {
  tab: 'weekly', mode: 'teacher',
  ym: `${today.getFullYear()}-${pad(today.getMonth() + 1)}`,
  expandedDates: [], editStudentId: null, editGroupId: null, slot: null, session: null,
};
try { Object.assign(view, JSON.parse(localStorage.getItem(LS_VIEW) || '{}')); } catch (e) {}

/* ---------- utils ---------- */
function money(n) { return (Number(n) || 0).toLocaleString('th-TH'); }
function escapeHtml(str) { return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function ymLabel(ym) { const [y, m] = ym.split('-').map(Number); return `${TH_MONTHS[m - 1]} ${y + 543}`; }
function dateLabel(ds) { const [y, m, d] = ds.split('-').map(Number); return `วัน${DOW_NAMES[C.dowOf(ds)]}ที่ ${d} ${TH_MONTHS[m - 1]} ${y + 543}`; }
function splitList(s) { return String(s || '').split(/[,\n]/).map(x => x.trim()).filter(Boolean); }
function numOrNull(v) { return (v === '' || v == null || isNaN(Number(v))) ? null : Number(v); }
function studentName(id) { const s = C.studentById(S, id); return s ? s.name : '?'; }
function $(id) { return document.getElementById(id); }
function showToast(msg) {
  const t = $('toast'); if (!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._t); showToast._t = setTimeout(() => t.classList.remove('show'), 1900);
}
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
function saveView() { lsSet(LS_VIEW, JSON.stringify({ tab: view.tab, mode: view.mode, ym: view.ym })); }

/* ---------- persistence & GitHub sync ---------- */
function writeLocal() { lsSet(LS_KEY, JSON.stringify({ state: S, baseRev: sync.baseRev, dirty: sync.dirty })); }
function readLocal() { try { return JSON.parse(lsGet(LS_KEY) || 'null'); } catch (e) { return null; } }

function saveState(msg) {
  S.meta.updatedAt = new Date().toISOString();
  sync.dirty = true;
  writeLocal(); render();
  if (msg) showToast(msg);
}

function ghCfg() {
  let c = {};
  try { c = JSON.parse(lsGet(LS_GH) || '{}'); } catch (e) {}
  // default to the repo this page is served from: <owner>.github.io/<repo>/
  const host = location.hostname, seg = location.pathname.split('/').filter(Boolean)[0];
  const guess = host.endsWith('.github.io') && seg ? `${host.split('.')[0]}/${seg}` : '';
  return { token: c.token || '', repo: c.repo || guess, branch: c.branch || 'main', path: c.path || 'data.json' };
}
function b64EncodeUtf8(str) {
  const bytes = new TextEncoder().encode(str); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64DecodeUtf8(b64) {
  const bin = atob(b64.replace(/\s/g, ''));
  return new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0)));
}
async function ghApi(cfg, method, body) {
  const url = `https://api.github.com/repos/${cfg.repo}/contents/${cfg.path}` + (method === 'GET' ? `?ref=${encodeURIComponent(cfg.branch)}&t=${Date.now()}` : '');
  const res = await fetch(url, {
    method, cache: 'no-store',
    headers: { 'Accept': 'application/vnd.github+json', 'Authorization': `Bearer ${cfg.token}`, ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (method === 'GET' && res.status === 404) return null;
  if (!res.ok) throw new Error(`GitHub ${res.status}: ${(await res.text()).slice(0, 160)}`);
  return res.json();
}
/** Latest data.json: via the GitHub API when a token is set (no CDN delay), otherwise from the site itself. */
async function fetchRemote() {
  const cfg = ghCfg();
  if (cfg.token && cfg.repo) {
    const f = await ghApi(cfg, 'GET');
    if (!f) return null;
    return { state: C.normalizeState(JSON.parse(b64DecodeUtf8(f.content))), sha: f.sha };
  }
  const res = await fetch(`./data.json?t=${Date.now()}`, { cache: 'no-store' });
  if (!res.ok) throw new Error(`data.json ${res.status}`);
  return { state: C.normalizeState(await res.json()) };
}

async function boot() {
  const local = readLocal();
  let remote = null;
  try { remote = await fetchRemote(); } catch (e) { sync.error = 'โหลดข้อมูลจาก GitHub ไม่ได้ (ออฟไลน์?) — ใช้ข้อมูลในเครื่องแทน'; }

  if (local && local.state && local.dirty) {
    S = C.normalizeState(local.state); sync.baseRev = local.baseRev || 0; sync.dirty = true;
    if (remote && remote.state.meta.rev !== sync.baseRev) sync.conflict = remote.state;
  } else if (remote) {
    S = remote.state; sync.baseRev = S.meta.rev; sync.dirty = false; writeLocal();
  } else if (local && local.state) {
    S = C.normalizeState(local.state); sync.baseRev = local.baseRev || 0;
  }
  const old = lsGet(LS_OLD);
  if (old && !lsGet(LS_OLD_DONE)) sync.oldLocal = old;
  sync.loaded = true;
  render();
}

async function pullFromGitHub() {
  if (sync.dirty && !confirm('เครื่องนี้มีการแก้ไขที่ยังไม่ได้ส่งขึ้น GitHub — ดึงข้อมูลจาก GitHub มาทับใช่ไหม?')) return;
  try {
    const r = sync.conflict ? { state: sync.conflict } : await fetchRemote();
    if (!r) { alert('ยังไม่มี data.json บน GitHub'); return; }
    S = r.state; sync.baseRev = S.meta.rev; sync.dirty = false; sync.conflict = null; sync.error = null;
    writeLocal(); render(); showToast('ดึงข้อมูลล่าสุดจาก GitHub แล้ว');
  } catch (e) { alert('ดึงข้อมูลไม่สำเร็จ: ' + e.message); }
}

async function pushToGitHub() {
  const cfg = ghCfg();
  if (!cfg.token || !cfg.repo) {
    view.tab = 'export'; render(); showToast('ใส่ GitHub token ในการ์ด "ซิงก์กับ GitHub" ก่อน');
    return;
  }
  try {
    showToast('กำลังส่งขึ้น GitHub…');
    const cur = await ghApi(cfg, 'GET');
    let curRev = 0;
    if (cur) { try { curRev = C.normalizeState(JSON.parse(b64DecodeUtf8(cur.content))).meta.rev; } catch (e) {} }
    if (cur && curRev !== sync.baseRev &&
        !confirm(`ข้อมูลบน GitHub ถูกแก้ไขหลังจากที่เครื่องนี้โหลดมา (rev ${curRev} ≠ ${sync.baseRev}) เช่น Claude อัปเดตให้\nจะเขียนทับด้วยข้อมูลในเครื่องนี้ใช่ไหม?`)) return;
    S.meta.rev = Math.max(curRev, sync.baseRev) + 1;
    S.meta.updatedAt = new Date().toISOString();
    await ghApi(cfg, 'PUT', {
      message: `Update schedule data (rev ${S.meta.rev})`,
      content: b64EncodeUtf8(JSON.stringify(S, null, 2) + '\n'),
      branch: cfg.branch, ...(cur ? { sha: cur.sha } : {}),
    });
    sync.baseRev = S.meta.rev; sync.dirty = false; sync.conflict = null;
    writeLocal(); render(); showToast('ส่งขึ้น GitHub แล้ว ✓');
  } catch (e) { alert('ส่งขึ้น GitHub ไม่สำเร็จ: ' + e.message); }
}

function downloadDataJson() {
  const blob = new Blob([JSON.stringify(S, null, 2) + '\n'], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'data.json'; a.click();
  showToast('ดาวน์โหลด data.json แล้ว');
}

function importOldLocal() {
  try {
    const old = JSON.parse(sync.oldLocal);
    if (!confirm(`นำข้อมูลจากเวอร์ชันเก่าในเครื่องนี้มาแทนข้อมูลปัจจุบัน?\n(ตารางรายสัปดาห์เดิมจะถูกใส่เป็นเดือน ${ymLabel(view.ym)})`)) return;
    const meta = S.meta;
    S = C.normalizeState(old, { templateMonths: [view.ym] }); S.meta = meta;
    lsSet(LS_OLD_DONE, '1'); sync.oldLocal = null;
    saveState('นำเข้าข้อมูลเก่าแล้ว');
  } catch (e) { alert('ข้อมูลเก่าอ่านไม่ได้: ' + e.message); }
}

function updateSyncPill() {
  const el = $('syncPill'); if (!el) return;
  el.className = 'sync-pill teacher-only';
  if (!sync.loaded) { el.textContent = 'กำลังโหลด…'; return; }
  if (sync.conflict) { el.classList.add('err'); el.textContent = '⚠️ GitHub มีข้อมูลใหม่กว่า'; }
  else if (sync.dirty) { el.classList.add('dirty'); el.textContent = '● ยังไม่ส่งขึ้น GitHub'; }
  else if (sync.error) { el.classList.add('err'); el.textContent = '⚠️ ออฟไลน์'; }
  else { el.classList.add('ok'); el.textContent = `☁️ ตรงกับ GitHub (rev ${sync.baseRev})`; }
}

function renderBanners() {
  const el = $('bannerArea'); if (!el) return;
  const out = [];
  if (sync.conflict) out.push(`<div class="banner err"><div>⚠️ ข้อมูลบน GitHub ถูกอัปเดต (rev ${sync.conflict.meta.rev}) แต่เครื่องนี้มีการแก้ไขที่ยังไม่ได้ส่งขึ้น</div>
    <div class="actions"><button class="btn small primary" data-act="pull" type="button">ใช้ข้อมูลล่าสุดจาก GitHub</button><button class="btn small" data-act="push" type="button">ส่งของเครื่องนี้ขึ้นไปทับ</button></div></div>`);
  if (sync.oldLocal) out.push(`<div class="banner warn"><div>📦 พบข้อมูลจากเวอร์ชันเก่าที่บันทึกไว้ในเครื่องนี้</div>
    <div class="actions"><button class="btn small" data-act="import-old" type="button">นำเข้า</button><button class="btn small" data-act="dismiss-old" type="button">ไม่ต้อง</button></div></div>`);
  if (sync.error) out.push(`<div class="banner err"><div>${escapeHtml(sync.error)}</div></div>`);
  el.innerHTML = out.join('');
  el.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => {
    const a = b.dataset.act;
    if (a === 'pull') pullFromGitHub();
    else if (a === 'push') pushToGitHub();
    else if (a === 'import-old') importOldLocal();
    else if (a === 'dismiss-old') { lsSet(LS_OLD_DONE, '1'); sync.oldLocal = null; render(); }
  }));
}

/* ---------- app shell ---------- */
function updateHeader() { const el = $('monthDisplay'); if (el) el.textContent = ymLabel(view.ym); }

function setTab(tab) {
  view.tab = tab;
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}
function setMode(m) {
  view.mode = m;
  document.body.classList.toggle('student-mode', m === 'student');
  $('modeTeacherBtn').classList.toggle('active', m === 'teacher');
  $('modeStudentBtn').classList.toggle('active', m === 'student');
  if (m === 'student' && !['weekly', 'monthly'].includes(view.tab)) view.tab = 'weekly';
  setTab(view.tab);
}

function render() {
  updateHeader(); updateSyncPill(); renderBanners(); saveView();
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === view.tab));
  const panel = $('mainPanel'); if (!panel) return;
  if (!sync.loaded) { panel.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-muted);">กำลังโหลดข้อมูล…</div>'; return; }
  if (view.tab === 'weekly') renderWeeklyTab(panel);
  else if (view.tab === 'monthly') renderMonthlyTab(panel);
  else if (view.tab === 'students') renderStudentsTab(panel);
  else if (view.tab === 'billing') renderBillingTab(panel);
  else if (view.tab === 'export') renderExportTab(panel);
  panel.querySelectorAll('.card-btn').forEach(b => b.addEventListener('click', () => openCardModal(b.dataset.id)));
}

function initApp() {
  $('prevMonthBtn').addEventListener('click', () => { view.ym = C.shiftYM(view.ym, -1); view.expandedDates = []; render(); });
  $('nextMonthBtn').addEventListener('click', () => { view.ym = C.shiftYM(view.ym, 1); view.expandedDates = []; render(); });
  $('modeTeacherBtn').addEventListener('click', () => setMode('teacher'));
  $('modeStudentBtn').addEventListener('click', () => setMode('student'));
  $('syncPill').addEventListener('click', () => setTab('export'));
  document.querySelectorAll('[data-tab]').forEach(btn => btn.addEventListener('click', () => setTab(btn.dataset.tab)));
  ['slotModal', 'sessionModal', 'cardModal'].forEach(id => $(id).addEventListener('click', (e) => { if (e.target.id === id) closeModal(id); }));
  setMode(view.mode || 'teacher');
  boot();
}
function closeModal(id) {
  $(id).classList.remove('active');
  if (id === 'slotModal') view.slot = null; else if (id === 'sessionModal') view.session = null; else view.card = null;
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initApp); else initApp();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW failed:', err)));
}

      <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">

        <span style="color:var(--text-muted); font-size:12px;">💡 ลากการ์ดไปวางวันอื่นเพื่อย้ายวัน</span>

function renderSlotCard(slot) {
  const people = C.participantsOf(S, slot);
  const booked = C.isBooked(S, slot);
  const g = slot.groupId ? C.groupById(S, slot.groupId) : null;
  const subj = C.slotSubject(S, slot);
  const perSession = people.reduce((t, id) => t + C.rateFor(S, slot, id), 0);
  const sessions = C.sessionsOfSlot(S, view.ym, slot);
  const runs = sessions.filter(x => !x.cancelled).length;
  const names = people.map(studentName).join(', ');
  return `
    <div class="slot-card ${booked ? 'booked' : 'available'} ${g ? 'group-slot' : ''}" draggable="true" data-id="${slot.id}">
      <span class="time">${C.timeLabel(slot)}</span>
      ${slot.flex ? '<span class="badge">คาบสำรอง</span>' : ''}${slot.note ? `<span class="badge">${escapeHtml(slot.note)}</span>` : ''}
      ${booked ? `
        <span class="status">จองแล้ว</span>
        <span class="hc">${people.length} คน</span>
        ${subj ? `<span class="subj">${escapeHtml(subj)}</span>` : ''}
        ${g ? `<span class="students">👥 ${escapeHtml(g.name)}${names ? ': ' + escapeHtml(names) : ''}</span>` : `<span class="students">👤 ${escapeHtml(names)}</span>`}
        ${g && !people.length ? '<span class="warn teacher-only">⚠️ ยังไม่ใส่สมาชิกกลุ่ม</span>' : ''}
        <span class="price">${slot.flex ? 'ยืดหยุ่น' : money(perSession) + ' บาท/ครั้ง'}</span>
        ${runs < sessions.length ? `<span class="skipinfo teacher-only">เรียน ${runs}/${sessions.length} ครั้งในเดือนนี้</span>` : ''}
      ` : `
        <span class="status">ว่าง</span>
        <span class="price">${slot.flex ? 'สำรอง' : 'เดี่ยว ' + money(S.settings.privateRate) + ' · กลุ่ม ' + money(S.settings.groupRate)}</span>
      `}

}

let draggedId = null;
function attachDragAndDrop(panel) {
  panel.querySelectorAll('.slot-card[draggable="true"]').forEach(card => {
    card.addEventListener('dragstart', (e) => { draggedId = card.dataset.id; e.dataTransfer.effectAllowed = 'move'; });
    card.addEventListener('dragend', () => { draggedId = null; });
  });
  panel.querySelectorAll('.day-body[data-dow]').forEach(body => {
    body.addEventListener('dragover', (e) => { if (draggedId) { e.preventDefault(); body.classList.add('drag-over'); } });
    body.addEventListener('dragleave', () => body.classList.remove('drag-over'));
    body.addEventListener('drop', (e) => {
      e.preventDefault(); body.classList.remove('drag-over');
      const slot = draggedId && C.findSlot(S, view.ym, draggedId);
      const dow = Number(body.dataset.dow);
      if (slot && slot.dow !== dow) {
        slot.dow = dow;
        slot.skip = []; slot.off = []; // dates belonged to the old weekday
        saveState(`ย้ายไปวัน${DOW_NAMES[dow]}แล้ว`);
      }
      draggedId = null;
    });
  });
}

/* ---------- slot modal ---------- */
function openSlotModal(id, dow) {
  if (view.mode === 'student') return;
  const s = id ? C.findSlot(S, view.ym, id) : null;
  const draft = s ? JSON.parse(JSON.stringify(s)) : { dow: dow ?? 1, start: '', end: '', subject: '', groupId: null, studentIds: [], price: null, note: '', flex: false, skip: [] };
  view.slot = { id: s ? s.id : null, kind: draft.groupId ? 'group' : 'single', draft, newNames: '', newGroup: '', creatingGroup: false };
  if (!s) { // suggest the next free time after the day's last class
    const last = C.slotsByDay(S, view.ym, draft.dow).slice(-1)[0];
    draft.start = last ? last.end : '16:30';
    draft.end = addMinutes(draft.start, 90);
  }
  renderSlotModal();
  $('slotModal').classList.add('active');
}
function addMinutes(hhmm, mins) {
  const [h, m] = hhmm.split(':').map(Number); const t = Math.min(h * 60 + m + mins, 23 * 60 + 59);
  return `${pad(Math.floor(t / 60))}:${pad(t % 60)}`;
}

function collectSlotForm() {
  const v = view.slot, d = v.draft;
  d.dow = Number($('slDow').value);
  d.start = $('slStart').value; d.end = $('slEnd').value;
  d.flex = $('slFlex').checked;
  d.subject = $('slSubject').value.trim();
  d.price = numOrNull($('slPrice').value);
  d.note = $('slNote').value.trim();
  if ($('slNewNames')) v.newNames = $('slNewNames').value;
  if (document.querySelector('.slStudent') || $('slNewNames')) d.studentIds = [...document.querySelectorAll('.slStudent:checked')].map(x => x.value);
  if ($('slNewGroup')) v.newGroup = $('slNewGroup').value;
}

function saveSlotModal() {
  collectSlotForm();
  const v = view.slot, d = v.draft;
  if (!d.start || !d.end || d.end <= d.start) { alert('กรุณาใส่เวลาเริ่มและเวลาจบให้ถูกต้อง'); return; }
  if (v.kind === 'group') {
    const newName = v.creatingGroup ? (v.newGroup || '').trim() : '';
    if (v.creatingGroup && !newName) { alert('กรุณาตั้งชื่อกลุ่มใหม่'); return; }
    if (newName) {
      const g = { id: C.uid('gr'), name: newName, aliases: [newName], subject: d.subject, rate: null, memberIds: [] };
      S.groups.push(g); d.groupId = g.id;
    }
    if (!d.groupId) { alert('กรุณาเลือกหรือสร้างกลุ่ม'); return; }
    d.studentIds = [];
  } else {
    for (const name of splitList(v.newNames)) {
      let st = S.students.find(s => s.name === name);
      if (!st) { st = { id: C.uid('st'), name, aliases: [], parentTitle: 'คุณแม่', subject: d.subject, rate: null }; S.students.push(st); }
      if (!d.studentIds.includes(st.id)) d.studentIds.push(st.id);
    }
    d.groupId = null;
  }
  if (v.id) {
    const s = C.findSlot(S, view.ym, v.id);
    if (s.dow !== d.dow) { d.skip = []; d.off = []; }
    Object.assign(s, d, { id: s.id });
  } else {
    C.addSlot(S, view.ym, d);
  }
  closeModal('slotModal');
  saveState('บันทึกคาบเรียนแล้ว');
}

/* =========================================
   TAB 2: MONTHLY CALENDAR
   ========================================= */
function renderMonthlyTab(panel) {
  const ym = view.ym;
  const [y, m] = ym.split('-').map(Number);
  const nd = C.daysInMonth(ym);
  const firstDow = C.dowOf(`${ym}-01`);
  const sessIndex = {};
  for (const slot of C.getMonth(S, ym).slots) {
    if (!C.isBooked(S, slot)) continue;
    sessIndex[slot.id] = Object.fromEntries(C.sessionsOfSlot(S, ym, slot).map(x => [x.date, x]));
  }
  const CHIP_LIMIT = 4;
  let cells = '';
  for (let i = 0; i < firstDow; i++) cells += '<div class="month-cell empty"></div>';
  for (let d = 1; d <= nd; d++) {
    const ds = `${ym}-${pad(d)}`;
    const dow = C.dowOf(ds);
    const blocked = C.isBlocked(S, ds);
    const daySlots = C.slotsByDay(S, ym, dow).filter(s => sessIndex[s.id]);
    const expanded = view.expandedDates.includes(ds);
    const visible = expanded ? daySlots : daySlots.slice(0, CHIP_LIMIT);
    let chips = visible.map(slot => {
      const ses = sessIndex[slot.id][ds];
      let cls = 'chip-item';
      if (ses.teacherOff) cls += ' teacher-off';
      else if (ses.cancelled) cls += ' cancelled';
      else if (ses.absent.length && !ses.present.length) cls += ' absent';
      else if (ses.absent.length) cls += ' partial';
      return `<span class="${cls}" data-slot="${slot.id}" data-ds="${ds}"><span class="chip-time">${slot.start}</span>${escapeHtml(C.slotTitle(S, slot) || 'ว่าง')}</span>`;
    }).join('');
    if (daySlots.length > CHIP_LIMIT) chips += `<span class="chip-item chip-more" data-ds="${ds}">${expanded ? 'ย่อ' : `+${daySlots.length - CHIP_LIMIT} เพิ่มเติม`}</span>`;
    cells += `<div class="month-cell ${blocked ? 'blocked' : ''}" data-ds="${ds}"><div class="num">${d}</div>${blocked ? '<div class="blocked-label">ครูลา</div>' : ''}${chips}</div>`;
  }

  panel.innerHTML = `
    <h2>ปฏิทินเดือน ${TH_MONTHS[m - 1]} ${y + 543}</h2>
    <div class="hint-text teacher-only">
      👉 คลิก <b>ชิปคาบเรียน</b> เพื่องดคาบเฉพาะวันนั้น หรือติ๊กว่าใครลา (คิดเงินตามจริงอัตโนมัติ)<br>
      👉 คลิกที่ <b>ว่างในกล่องวันที่</b> = ครูลาทั้งวัน (ตัวแดงขีดฆ่าในการ์ดของนักเรียนที่มีเรียนวันนั้น)
    </div>
    <div class="month-grid">
      ${DOW_SHORT.map(x => `<div class="month-dow">${x}</div>`).join('')}
      ${cells}
    </div>`;

  panel.querySelectorAll('.month-cell[data-ds]').forEach(cell => cell.addEventListener('click', (e) => {
    if (view.mode === 'student') return;
    const chip = e.target.closest('.chip-item');
    if (chip && chip.classList.contains('chip-more')) {
      const ds = chip.dataset.ds, i = view.expandedDates.indexOf(ds);
      if (i >= 0) view.expandedDates.splice(i, 1); else view.expandedDates.push(ds);
      render();
    } else if (chip) {
      openSessionModal(chip.dataset.slot, chip.dataset.ds);
    } else {
      const ds = cell.dataset.ds, i = S.blocked.findIndex(b => b.date === ds);
      if (i >= 0) S.blocked.splice(i, 1); else S.blocked.push({ date: ds });
      saveState(i >= 0 ? 'ยกเลิกครูลาแล้ว' : 'ครูลาทั้งวันแล้ว — แจ้งในการ์ดของนักเรียนที่เรียนวันนี้');
    }
  }));
}

function openSessionModal(slotId, ds) {
  const slot = C.findSlot(S, view.ym, slotId); if (!slot) return;
  view.session = { slotId, ds };
  const people = C.participantsOf(S, slot);
  const dayOff = C.isBlocked(S, ds) || C.isDayClosed(S, view.ym, slot.dow);
  const state = slot.off.includes(ds) ? 'off' : slot.skip.includes(ds) ? 'skip' : 'normal';
  const opt = (v, label, hint) => `<label class="session-person" style="justify-content:flex-start; gap:10px;">
      <input type="radio" name="sesState" value="${v}" ${state === v ? 'checked' : ''} ${dayOff ? 'disabled' : ''} style="width:auto; -webkit-appearance:auto; appearance:auto;">
      <span>${label}<span class="field-hint" style="display:block; margin:0;">${hint}</span></span></label>`;
  $('sessionModalBox').innerHTML = `
    <h3>${escapeHtml(C.slotTitle(S, slot) || 'คาบว่าง')}</h3>
    <div class="time-info">${dateLabel(ds)} · ${C.timeLabel(slot)}${C.slotSubject(S, slot) ? ' · ' + escapeHtml(C.slotSubject(S, slot)) : ''}</div>
    ${dayOff ? `<div class="banner err" style="margin-bottom:12px;">${C.isBlocked(S, ds) ? 'ครูลาทั้งวัน (กดที่ว่างในช่องวันที่ในปฏิทินเพื่อยกเลิก)' : 'วันหยุดประจำสัปดาห์ของเดือนนี้'}</div>` : ''}
    <div class="modal-field">
      <label>คาบนี้วันนี้</label>
      ${opt('normal', '✅ เรียนตามปกติ', '')}
      ${opt('off', '🔴 ครูลา', 'ขึ้นตัวแดงขีดฆ่าในการ์ดของนักเรียนคาบนี้ · ไม่คิดเงิน')}
      ${opt('skip', '⚪️ ไม่มีคาบ (ไม่แสดง)', 'เช่น สัปดาห์นี้ไม่ได้นัด · ไม่คิดเงิน')}
    </div>
    <div class="modal-field">
      <label>ใครมาเรียน (เอาติ๊กออก = ลา ไม่คิดเงินวันนั้น)</label>
      ${people.length ? people.map(id => `<label class="session-person"><span>${escapeHtml(studentName(id))}</span><input type="checkbox" class="sesPresent" value="${id}" ${C.isAbsent(S, id, ds) ? '' : 'checked'}></label>`).join('') : '<div class="field-hint">⚠️ ยังไม่มีสมาชิก</div>'}
      <div class="field-hint">การลาบันทึกเป็นรายวัน (มีผลกับทุกคาบของคนนั้นในวันนั้น)</div>
    </div>
    <div class="modal-btns">
      <button class="btn" id="sesCancel" type="button">ยกเลิก</button>
      <button class="btn primary" id="sesSave" type="button">บันทึก</button>
    </div>`;
  $('sesCancel').addEventListener('click', () => closeModal('sessionModal'));
  $('sesSave').addEventListener('click', () => {
    const st = (document.querySelector('input[name=sesState]:checked') || {}).value || state;
    if (!dayOff) {
      slot.skip = slot.skip.filter(x => x !== ds); slot.off = slot.off.filter(x => x !== ds);
      if (st === 'skip') slot.skip.push(ds);
      if (st === 'off') slot.off.push(ds);
      slot.skip.sort(); slot.off.sort();
    }
    document.querySelectorAll('.sesPresent').forEach(cb => {
      S.absences = S.absences.filter(a => !(a.studentId === cb.value && a.date === ds));
      if (!cb.checked) S.absences.push({ studentId: cb.value, date: ds });
    });
    closeModal('sessionModal'); saveState('บันทึกแล้ว');
  });
  $('sessionModal').classList.add('active');
}

/* =========================================
   TAB 3: STUDENTS & GROUPS (price database)
   ========================================= */
function renderStudentsTab(panel) {
  const bill = C.billMonth(S, view.ym);
  const billOf = Object.fromEntries(bill.students.map(b => [b.studentId, b]));
  const es = view.editStudentId ? C.studentById(S, view.editStudentId) : null;
  const eg = view.editGroupId ? C.groupById(S, view.editGroupId) : null;
  const groupsOf = (sid) => S.groups.filter(g => g.memberIds.includes(sid));
  const monthSlots = C.getMonth(S, view.ym).slots;

  const studentForm = `
    <div class="form-box" id="studentForm">
      <div><label>ชื่อนักเรียน</label><input type="text" id="stName" value="${escapeHtml(es?.name || '')}" placeholder="เช่น น้องพันพัน"></div>
      <div><label>ชื่อใน Google Calendar / ชื่อเล่นอื่น</label><input type="text" id="stAliases" value="${escapeHtml((es?.aliases || []).join(', '))}" placeholder="เช่น Nene, Nene M.6"></div>
      <div><label>คำเรียกผู้ปกครอง</label><input type="text" id="stParent" value="${escapeHtml(es?.parentTitle || 'คุณแม่')}"></div>
      <div><label>วิชาหลัก</label><input type="text" id="stSubject" value="${escapeHtml(es?.subject || '')}" placeholder="เช่น คณิต ม.3"></div>
      <div><label>ราคาเรียนเดี่ยวต่อคาบ (บาท)</label><input type="number" id="stRate" value="${es?.rate ?? ''}" placeholder="ว่าง = ${S.settings.privateRate} (เรียนเดี่ยว)"></div>
      <div class="full-width"><label>อยู่กลุ่ม</label>
        <div class="check-list">${S.groups.length ? S.groups.map(g => `<label><input type="checkbox" class="stGroup" value="${g.id}" ${es && g.memberIds.includes(es.id) ? 'checked' : ''}> ${escapeHtml(g.name)}</label>`).join('') : '<div class="none">ยังไม่มีกลุ่ม</div>'}</div>
      </div>
      <div class="full-width" style="display:flex; gap:8px;">
        <button class="btn primary" id="saveStudentBtn" type="button">${es ? 'บันทึกแก้ไข' : '+ เพิ่มนักเรียน'}</button>
        ${es ? '<button class="btn" id="cancelStudentBtn" type="button">ยกเลิก</button>' : ''}
      </div>
    </div>`;

  const groupForm = `
    <div class="form-box" id="groupForm">
      <div><label>ชื่อกลุ่ม</label><input type="text" id="grName" value="${escapeHtml(eg?.name || '')}" placeholder="เช่น SMTE"></div>
      <div><label>ชื่อใน Google Calendar</label><input type="text" id="grAliases" value="${escapeHtml((eg?.aliases || []).join(', '))}" placeholder="เช่น SMTE"></div>
      <div><label>วิชา</label><input type="text" id="grSubject" value="${escapeHtml(eg?.subject || '')}" placeholder="เช่น คณิต SMTE"></div>
      <div><label>ราคาต่อคนต่อคาบ (บาท)</label><input type="number" id="grRate" value="${eg?.rate ?? ''}" placeholder="ว่าง = ${S.settings.groupRate}"></div>
      <div class="full-width"><label>สมาชิก (คิดเงินแยกรายคน)</label>
        <div class="check-list">${S.students.length ? S.students.map(s => `<label><input type="checkbox" class="grMember" value="${s.id}" ${eg && eg.memberIds.includes(s.id) ? 'checked' : ''}> ${escapeHtml(s.name)}</label>`).join('') : '<div class="none">ยังไม่มีนักเรียน</div>'}</div>
      </div>
      <div class="full-width" style="display:flex; gap:8px;">
        <button class="btn primary" id="saveGroupBtn" type="button">${eg ? 'บันทึกกลุ่ม' : '+ สร้างกลุ่ม'}</button>
        ${eg ? '<button class="btn" id="cancelGroupBtn" type="button">ยกเลิก</button>' : ''}
      </div>
    </div>`;

  const groupCards = S.groups.map(g => {
    const used = monthSlots.filter(s => s.groupId === g.id).length;
    return `
      <div class="item-card ${g.memberIds.length ? '' : 'warn-card'}">
        <div class="head">
          <div>
            <div class="title">👥 ${escapeHtml(g.name)}</div>
            <div class="sub">${escapeHtml(g.subject || '-')} · ${money(g.rate != null ? g.rate : S.settings.groupRate)} บาท/คน/คาบ${g.rate != null ? '' : '*'} · ${used} คาบ/สัปดาห์ในเดือนนี้${g.aliases.length ? ' · ปฏิทิน: ' + escapeHtml(g.aliases.join(', ')) : ''}</div>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="btn small edit-gr-btn" data-id="${g.id}" type="button">แก้ไข / สมาชิก</button>
            <button class="btn small danger del-gr-btn" data-id="${g.id}" type="button">ลบ</button>
          </div>
        </div>
        <div>${g.memberIds.length ? g.memberIds.map(id => `<span class="tag">${escapeHtml(studentName(id))}</span>`).join('') : '<span class="tag warn">⚠️ ยังไม่มีสมาชิก — ยังไม่คิดเงินคาบของกลุ่มนี้</span>'}</div>
      </div>`;
  }).join('');

  const studentCards = S.students.map(s => {
    const b = billOf[s.id];
    return `
      <div class="item-card">
        <div class="head">
          <div>
            <div class="title">👤 ${escapeHtml(s.name)} <span style="font-weight:600; color:var(--text-muted); font-size:13px;">เดี่ยว ${s.rate != null ? money(s.rate) : money(S.settings.privateRate) + '*'} บาท/คาบ</span></div>
            <div class="sub">${escapeHtml(s.parentTitle)}${s.subject ? ' · ' + escapeHtml(s.subject) : ''}${s.aliases.length ? ' · ปฏิทิน: ' + escapeHtml(s.aliases.join(', ')) : ''}</div>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="btn small card-btn" data-id="${s.id}" type="button">🖼️ การ์ด</button>
            <button class="btn small edit-st-btn" data-id="${s.id}" type="button">แก้ไข</button>
            <button class="btn small danger del-st-btn" data-id="${s.id}" type="button">ลบ</button>
          </div>
        </div>
        <div>
          ${groupsOf(s.id).map(g => `<span class="tag">👥 ${escapeHtml(g.name)}</span>`).join('')}
          <span class="tag ${b ? '' : 'muted'}">${ymLabel(view.ym)}: ${b ? `${b.count} ครั้ง · ${money(b.total)} บาท` : 'ไม่มีคาบ'}</span>
        </div>
      </div>`;
  }).join('');

  panel.innerHTML = `
    <h2>กลุ่ม / คลาสกลุ่ม (${S.groups.length})</h2>
    <div class="hint-text">ลงตารางเป็นกลุ่มครั้งเดียว ระบบคิดเงินแยกให้สมาชิกแต่ละคน (ราคากลุ่ม ว่างไว้ = ${money(S.settings.groupRate)} บาท/คน/ครั้ง)</div>
    ${groupForm}
    ${groupCards || '<div class="hint-text">ยังไม่มีกลุ่ม</div>'}

    <h2 style="margin-top:28px;">นักเรียน (${S.students.length} คน)</h2>
    <div class="hint-text">ฐานข้อมูลราคา: คลาสกลุ่มคิด ${money(S.settings.groupRate)} บาท/คน/ครั้ง · เรียนเดี่ยวเริ่มที่ ${money(S.settings.privateRate)} บาท (ใส่ราคาเฉพาะคนได้, * = ราคาตั้งต้น) · "ชื่อใน Google Calendar" ใช้จับคู่ตอนนำเข้าตารางจากปฏิทิน</div>
    ${studentForm}
    ${studentCards || '<div class="hint-text">ยังไม่มีนักเรียน</div>'}
  `;

  // student form
  $('saveStudentBtn').addEventListener('click', () => {
    const name = $('stName').value.trim();
    if (!name) { alert('กรุณากรอกชื่อนักเรียน'); return; }
    const data = { name, aliases: splitList($('stAliases').value), parentTitle: $('stParent').value.trim() || 'คุณแม่', subject: $('stSubject').value.trim(), rate: numOrNull($('stRate').value) };
    let st = es;
    if (st) Object.assign(st, data); else { st = Object.assign({ id: C.uid('st') }, data); S.students.push(st); }
    const chosen = [...document.querySelectorAll('.stGroup:checked')].map(x => x.value);
    S.groups.forEach(g => {
      const has = g.memberIds.includes(st.id);
      if (chosen.includes(g.id) && !has) g.memberIds.push(st.id);
      if (!chosen.includes(g.id) && has) g.memberIds = g.memberIds.filter(x => x !== st.id);
    });
    view.editStudentId = null; saveState('บันทึกนักเรียนแล้ว');
  });
  $('cancelStudentBtn')?.addEventListener('click', () => { view.editStudentId = null; render(); });
  panel.querySelectorAll('.edit-st-btn').forEach(b => b.addEventListener('click', () => {
    view.editStudentId = b.dataset.id; render(); $('studentForm').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }));
  panel.querySelectorAll('.del-st-btn').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.id;
    if (!confirm(`ลบ ${studentName(id)}? (จะถูกเอาออกจากกลุ่มและตารางทุกเดือน)`)) return;
    S.students = S.students.filter(s => s.id !== id);
    S.groups.forEach(g => { g.memberIds = g.memberIds.filter(x => x !== id); });
    Object.values(S.months).forEach(m => m.slots.forEach(sl => { sl.studentIds = sl.studentIds.filter(x => x !== id); }));
    S.absences = S.absences.filter(a => a.studentId !== id);
    saveState('ลบนักเรียนแล้ว');
  }));

  // group form
  $('saveGroupBtn').addEventListener('click', () => {
    const name = $('grName').value.trim();
    if (!name) { alert('กรุณากรอกชื่อกลุ่ม'); return; }
    const aliases = splitList($('grAliases').value);
    const data = { name, aliases: aliases.length ? aliases : [name], subject: $('grSubject').value.trim(), rate: numOrNull($('grRate').value), memberIds: [...document.querySelectorAll('.grMember:checked')].map(x => x.value) };
    if (eg) Object.assign(eg, data); else S.groups.push(Object.assign({ id: C.uid('gr') }, data));
    view.editGroupId = null; saveState('บันทึกกลุ่มแล้ว');
  });
  $('cancelGroupBtn')?.addEventListener('click', () => { view.editGroupId = null; render(); });
  panel.querySelectorAll('.edit-gr-btn').forEach(b => b.addEventListener('click', () => {
    view.editGroupId = b.dataset.id; render(); $('groupForm').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }));
  panel.querySelectorAll('.del-gr-btn').forEach(b => b.addEventListener('click', () => {
    const g = C.groupById(S, b.dataset.id);
    if (!confirm(`ลบกลุ่ม ${g.name}? (คาบของกลุ่มนี้จะกลายเป็นคาบรายคนของสมาชิกเดิม)`)) return;
    Object.values(S.months).forEach(m => m.slots.forEach(sl => {
      if (sl.groupId === g.id) { sl.groupId = null; sl.studentIds = [...new Set([...g.memberIds, ...sl.studentIds])]; if (!sl.subject) sl.subject = g.subject; }
    }));
    S.groups = S.groups.filter(x => x.id !== g.id);
    saveState('ลบกลุ่มแล้ว');
  }));
}

/* =========================================
   TAB 4: BILLING (per person, groups split)
   ========================================= */
function buildMessage(student, b) {
  const lines = b.lines.map(l => `🗓️ วัน${DOW_NAMES[l.dow]}: วันที่ ${l.days.join(', ')} (${l.days.length} ครั้ง)
${l.subject || l.groupName ? `• วิชา: ${l.subject || '-'}${l.groupName ? ` (คลาสกลุ่ม ${l.groupName})` : ''}\n` : ''}• เวลาเรียน: ${l.time} น.
• ยอดรวม: ${l.days.length} ครั้ง × ${money(l.rate)} บาท = ${money(l.subtotal)} บาท${l.offDays.length ? `\n• ${cardPrefs().teacherName || 'ครู'}ลา: วันที่ ${l.offDays.join(', ')} (ไม่คิดค่าเรียน)` : ''}`);
  return `สวัสดีครับ${student.parentTitle}
ขออนุญาตแจ้งสรุปค่าเรียนพิเศษของน้อง (${student.name}) นะครับ

📌 ตารางเรียน (${student.name}) – (${ymLabel(view.ym)})

${lines.join('\n\n')}

✅ ยอดรวมสุทธิ: ${money(b.total)} บาท

ขอบคุณครับ 🙏`;
}

function renderBillingTab(panel) {
  const bill = C.billMonth(S, view.ym);
  const warn = bill.emptyGroups.length ? `
    <div class="banner warn"><div>⚠️ กลุ่มที่ยังไม่มีสมาชิก จึงยังไม่ถูกคิดเงิน: <b>${bill.emptyGroups.map(g => escapeHtml(g.name)).join(', ')}</b></div>
      <div class="actions"><button class="btn small" id="goGroupsBtn" type="button">ไปใส่สมาชิก</button></div></div>` : '';

  if (!bill.students.length) {
    panel.innerHTML = `<h2>สรุปค่าเรียน & แจ้งผู้ปกครอง — ${ymLabel(view.ym)}</h2>${warn}
      <div style="padding:20px; text-align:center; color:var(--text-muted);">ยังไม่มีคาบเรียนที่คิดเงินได้ในเดือนนี้ (ไปที่แท็บ "ตารางรายสัปดาห์" เพื่อลงตาราง)</div>`;
    $('goGroupsBtn')?.addEventListener('click', () => setTab('students'));
    return;
  }

  const cards = bill.students.map(b => {
    const s = C.studentById(S, b.studentId);
    const msgId = 'msg_' + s.id;
    return `
      <div class="item-card">
        <div class="head">
          <div class="title">👤 ${escapeHtml(s.name)} (${b.count} ครั้งรวม)</div>
          <div style="font-size:16px; font-weight:700; color:var(--accent-sage);">${money(b.total)} บาท</div>
        </div>
        <div>${[...new Set(b.lines.filter(l => l.groupName).map(l => l.groupName))].map(n => `<span class="tag">👥 ${escapeHtml(n)}</span>`).join('')}</div>
        <textarea id="${msgId}" class="msg-textarea">${escapeHtml(buildMessage(s, b))}</textarea>
        <div style="margin-top:10px; display:flex; gap:6px; flex-wrap:wrap;">
          <button class="btn primary small copy-msg-btn" data-target="${msgId}" type="button">📋 คัดลอกข้อความแจ้งผู้ปกครอง</button>
          <button class="btn small card-btn" data-id="${s.id}" type="button">🖼️ การ์ดตารางเรียน (PNG)</button>
        </div>
      </div>`;
  }).join('');

  panel.innerHTML = `
    <h2>สรุปค่าเรียน & แจ้งผู้ปกครอง — ${ymLabel(view.ym)}</h2>
    <div class="hint-text">คิดตามวันเรียนจริงของเดือนนี้ (หักวันงด วันครูลา และวันนักเรียนลาแล้ว) · คลาสกลุ่มคิดแยกรายคน</div>
    ${warn}
    ${cards}
    <div class="grand-box"><div>💰 ยอดรวมรายได้สุทธิเดือนนี้</div><div class="num">${money(bill.grandTotal)} บาท</div></div>`;

  $('goGroupsBtn')?.addEventListener('click', () => setTab('students'));
  panel.querySelectorAll('.copy-msg-btn').forEach(b => b.addEventListener('click', () => {
    const el = $(b.dataset.target); if (!el) return;
    el.select();
    const done = () => showToast('คัดลอกข้อความแล้ว');
    if (navigator.clipboard) navigator.clipboard.writeText(el.value).then(done).catch(() => { document.execCommand('copy'); done(); });
    else { document.execCommand('copy'); done(); }
  }));
}

/* =========================================

  $('csvTeacherBtn').addEventListener('click', () => exportCSV(true));
  $('csvStudentBtn').addEventListener('click', () => exportCSV(false));
  $('backupBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });

    a.download = `tutor_backup_${new Date().toISOString().slice(0, 10)}.json`; a.click(); showToast('สำรองข้อมูลเรียบร้อย');

    reader.onload = (evt) => {
      try {
        const meta = S.meta;
        S = C.normalizeState(JSON.parse(evt.target.result), { templateMonths: [view.ym] }); S.meta = meta;

    lsDel(LS_KEY); location.reload();

}

/* =========================================
   MINI SCHEDULE CARD (PNG for LINE)
   ========================================= */
const LS_CARD = 'tutor_card_prefs';
function cardPrefs() {
  let p = {};
  try { p = JSON.parse(lsGet(LS_CARD) || '{}'); } catch (e) {}
  return Object.assign({ showPrice: false, theme: 'light', footer: '', teacherName: 'พี่เจมส์' }, p);
}
/** ASCII file name (some browsers drop Thai characters in downloads): schedule-2026-11-Nene.png */
function cardFileName(sid) {
  const st = C.studentById(S, sid) || { id: sid, aliases: [] };
  const ascii = [...(st.aliases || []), st.name].find(n => /^[\x20-\x7E]+$/.test(n || ''));
  const tag = (ascii || st.id.slice(-6)).replace(/[^A-Za-z0-9.-]+/g, '-');
  return `schedule-${view.ym}-${tag}.png`;
}

function openCardModal(studentId) {
  view.card = { studentId, blob: null, url: null };
  renderCardModal();
  $('cardModal').classList.add('active');
}

function renderCardModal() {
  const c = view.card, pr = cardPrefs();
  const box = $('cardModalBox');
  const studentsWithClass = S.students.filter(s => C.studentMonthSchedule(S, view.ym, s.id).items.length);
  box.innerHTML = `
    <h3>การ์ดตารางเรียน</h3>
    <div class="time-info">${ymLabel(view.ym)} · ส่งต่อใน LINE ได้ทันที</div>
    <div class="modal-field">
      <select id="cardStudent">${(studentsWithClass.some(s => s.id === c.studentId) ? studentsWithClass : [C.studentById(S, c.studentId), ...studentsWithClass])
        .map(s => `<option value="${s.id}" ${s.id === c.studentId ? 'selected' : ''}>${escapeHtml(s.name)}</option>`).join('')}</select>
    </div>
    <div class="card-opts">
      <div class="seg" id="cardAudience">
        <button type="button" data-v="student" class="${pr.showPrice ? '' : 'active'}">🎒 นักเรียน</button>
        <button type="button" data-v="parent" class="${pr.showPrice ? 'active' : ''}">👪 ผู้ปกครอง (+ค่าเรียน)</button>
      </div>
      <div class="seg" id="cardTheme" style="flex:0 1 160px;">
        <button type="button" data-v="light" class="${pr.theme === 'light' ? 'active' : ''}">☀️</button>
        <button type="button" data-v="dark" class="${pr.theme === 'dark' ? 'active' : ''}">🌙</button>
      </div>
    </div>
    <div class="card-preview" id="cardPreview"><span style="color:var(--text-muted); font-size:13px;">กำลังสร้างรูป…</span></div>
    <div class="row2">
      <div class="modal-field"><label>ชื่อครู (ใช้ตอนแจ้งลา)</label><input type="text" id="cardTeacher" value="${escapeHtml(pr.teacherName)}" placeholder="พี่เจมส์"></div>
      <div class="modal-field"><label>ข้อความท้ายการ์ด</label><input type="text" id="cardFooter" value="${escapeHtml(pr.footer)}" placeholder="ไม่บังคับ"></div>
    </div>
    <div class="modal-btns">
      <button class="btn" id="cardClose" type="button">ปิด</button>
      <button class="btn" id="cardDownload" type="button">📥 ดาวน์โหลด PNG</button>
      <button class="btn primary" id="cardShare" type="button">📤 แชร์ (LINE)</button>
    </div>`;

  const savePref = (patch) => { lsSet(LS_CARD, JSON.stringify(Object.assign(cardPrefs(), patch))); drawCardPreview(); };
  $('cardStudent').addEventListener('change', (e) => { c.studentId = e.target.value; drawCardPreview(); });
  box.querySelectorAll('#cardAudience button').forEach(b => b.addEventListener('click', () => {
    box.querySelectorAll('#cardAudience button').forEach(x => x.classList.toggle('active', x === b));
    savePref({ showPrice: b.dataset.v === 'parent' });
  }));
  box.querySelectorAll('#cardTheme button').forEach(b => b.addEventListener('click', () => {
    box.querySelectorAll('#cardTheme button').forEach(x => x.classList.toggle('active', x === b));
    savePref({ theme: b.dataset.v });
  }));
  let footerTimer;
  $('cardFooter').addEventListener('input', (e) => { clearTimeout(footerTimer); footerTimer = setTimeout(() => savePref({ footer: e.target.value }), 400); });
  $('cardTeacher').addEventListener('input', (e) => { clearTimeout(footerTimer); footerTimer = setTimeout(() => savePref({ teacherName: e.target.value }), 400); });
  $('cardClose').addEventListener('click', () => closeModal('cardModal'));
  $('cardDownload').addEventListener('click', downloadCard);
  $('cardShare').addEventListener('click', shareCard);
  drawCardPreview();
}

async function drawCardPreview() {
  const c = view.card; if (!c) return;
  const pr = cardPrefs();
  const st = C.studentById(S, c.studentId);
  const canvas = await TutorCard.render({
    studentName: st ? st.name : '?', ym: view.ym, schedule: C.studentMonthSchedule(S, view.ym, c.studentId),
    showPrice: pr.showPrice, theme: pr.theme, footer: pr.footer, teacherName: pr.teacherName,
  });
  const blob = await TutorCard.toBlob(canvas);
  if (view.card !== c) return; // modal closed / reopened meanwhile
  if (c.url) URL.revokeObjectURL(c.url);
  c.blob = blob; c.url = URL.createObjectURL(blob);
  const pv = $('cardPreview'); if (pv) pv.innerHTML = `<img src="${c.url}" alt="การ์ดตารางเรียน">`;
}

function downloadCard() {
  const c = view.card; if (!c || !c.blob) return;
  const a = document.createElement('a'); a.href = c.url; a.download = cardFileName(c.studentId);
  document.body.appendChild(a); a.click(); a.remove(); // attached so Safari/Chrome keep the file name
  showToast('ดาวน์โหลดรูปแล้ว');
}

async function shareCard() {
  const c = view.card; if (!c || !c.blob) return;
  const file = new File([c.blob], cardFileName(c.studentId), { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: `ตารางเรียน ${studentName(c.studentId)}` }); }
    catch (e) { if (e.name !== 'AbortError') downloadCard(); }
  } else {
    downloadCard(); // desktop: save, then drag into LINE
    showToast('เครื่องนี้แชร์ตรงไม่ได้ — ดาวน์โหลดรูปแล้ว ลากไปส่งใน LINE ได้เลย');
  }
}

function exportPng() {
  showToast('กำลังสร้างรูปภาพ…');
  setTab('weekly');
  setTimeout(() => {
    if (!window.html2canvas) { alert('ไม่พบไลบรารีสร้างรูปภาพ กรุณาใช้ปุ่มพิมพ์/Save PDF'); return; }
    html2canvas(document.querySelector('.container'), { scale: 2 }).then(canvas => {
      const a = document.createElement('a');
      a.download = `ตารางสอน_${ymLabel(view.ym).replace(' ', '_')}.png`;
      a.href = canvas.toDataURL('image/png'); a.click(); showToast('ดาวน์โหลดรูปภาพแล้ว');
    });
  }, 400);
}

function exportCSV(isTeacher) {
  const headers = isTeacher
    ? ['วัน', 'เวลา', 'สถานะ', 'วิชา', 'กลุ่ม', 'รายชื่อนักเรียน', 'จำนวนคน', 'รายได้/ครั้ง', 'งดวันที่']
    : ['วัน', 'เวลา', 'สถานะ'];
  const rows = [headers];
  for (const dow of WEEKDAY_DOWS.concat(WEEKEND_DOWS)) {
    if (C.isDayClosed(S, view.ym, dow)) continue;
    for (const slot of C.slotsByDay(S, view.ym, dow)) {
      const people = C.participantsOf(S, slot);
      const booked = C.isBooked(S, slot);
      const g = slot.groupId ? C.groupById(S, slot.groupId) : null;
      rows.push(isTeacher
        ? [DOW_NAMES[dow], C.timeLabel(slot), booked ? 'จองแล้ว' : 'ว่าง', C.slotSubject(S, slot), g ? g.name : '', people.map(studentName).join('/'), people.length,
           slot.flex ? 0 : people.reduce((t, id) => t + C.rateFor(S, slot, id), 0), slot.skip.map(x => Number(x.slice(8))).join(' ')]
        : [DOW_NAMES[dow], C.timeLabel(slot), booked ? 'จองแล้ว' : 'ว่าง']);
    }
  }
  const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `ตารางสอน_${view.ym}_${isTeacher ? 'ครู' : 'นักเรียน'}.csv`; a.click();
  showToast('ดาวน์โหลด CSV เรียบร้อย');
}
</script>
