<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ตารางสอน & ระบบบัญชีติวเตอร์ (Minimal Suite)</title>

<!-- PWA: installability + home screen appearance -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#52796F">
<meta name="background-color" content="#F1F3F5">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ตารางติวเตอร์">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<!-- html2canvas for image export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --bg-page: #F8F9FA;
    --bg-card: #FFFFFF;
    --bg-sub: #F1F3F5;
    
    --text-primary: #212529;
    --text-secondary: #495057;
    --text-muted: #868E96;
    
    --border-color: #E9ECEF;
    --border-dark: #DEE2E6;
    
    --accent-sage: #52796F;
    --accent-sage-light: #E8F0EC;
    --accent-amber: #D97706;
    --accent-amber-light: #FEF3C7;
    --accent-rose: #E11D48;
    --accent-rose-light: #FFE4E6;
    
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
    --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.06);

    --font-body: 'Mali', system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;

    --bottom-nav-h: 64px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background-color: var(--bg-page);
    color: var(--text-primary);
    font-family: var(--font-body);
    min-height: 100vh;
    padding-bottom: 60px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 1140px;
    margin: 0 auto;
    padding: 24px 16px;
  }

  /* Header Minimal Style */
  header.app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding-bottom: 20px;
    margin-bottom: 20px;
    border-bottom: 1.5px solid var(--border-color);
    flex-wrap: wrap;
  }
  .app-title h1 {
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 4px;
    color: var(--accent-sage);
  }
  .app-title .subtitle {
    font-size: 13.5px;
    color: var(--text-muted);
  }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .month-picker {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-card);
    padding: 4px 12px;
    border-radius: 30px;
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-sm);
  }
  .month-picker button {
    background: none; border: none; color: var(--text-primary);
    font-size: 18px; cursor: pointer; width: 28px; height: 28px;
    border-radius: 50%; display: grid; place-items: center;
    font-family: inherit;
  }
  .month-picker button:active { background: var(--bg-sub); }
  .month-picker .label {
    font-weight: 600; font-size: 14px; min-width: 130px; text-align: center;
  }

  .view-switch {
    display: flex;
    background: var(--bg-sub);
    padding: 3px;
    border-radius: 30px;
  }
  .view-switch button {
    border: none; background: transparent; padding: 6px 14px; border-radius: 30px;
    font-family: inherit; font-weight: 600; font-size: 13px;
    cursor: pointer; color: var(--text-muted); transition: all 0.2s;
  }
  .view-switch button.active {
    background: var(--bg-card); color: var(--accent-sage);
    box-shadow: var(--shadow-sm); font-weight: 700;
  }

  /* Buttons */
  .btn {
    font-family: inherit; font-size: 13.5px; font-weight: 600;
    border-radius: var(--radius-sm); padding: 10px 16px; cursor: pointer;
    border: 1px solid var(--border-dark); background: var(--bg-card);
    color: var(--text-primary); display: inline-flex; align-items: center; gap: 6px;
    transition: all 0.15s ease; text-decoration: none; min-height: 40px;
    -webkit-appearance: none; appearance: none; touch-action: manipulation;
  }
  .btn:active { background: var(--bg-sub); }
  .btn.primary {
    background: var(--accent-sage); color: #FFF; border-color: var(--accent-sage);
  }
  .btn.danger {
    background: transparent; border-color: var(--accent-rose); color: var(--accent-rose);
  }
  .btn.danger:active { background: var(--accent-rose-light); }
  .btn.small { padding: 6px 12px; font-size: 12px; min-height: 34px; }

  /* Navigation Tabs */
  nav.app-tabs {
    display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
  }
  nav.app-tabs button {
    font-family: inherit; font-weight: 600; font-size: 13.5px;
    background: var(--bg-card); color: var(--text-muted);
    border: 1px solid var(--border-color); padding: 10px 18px;
    border-radius: var(--radius-md); cursor: pointer; transition: all 0.15s;
    box-shadow: var(--shadow-sm); -webkit-appearance: none;
  }
  nav.app-tabs button.active {
    background: var(--accent-sage); color: #FFF; border-color: var(--accent-sage);
    font-weight: 700;
  }

  /* Bottom mobile tab bar: hidden on desktop, shown via media query */
  nav.app-tabs-mobile {
    display: none;
  }

  /* Main Container Panel */
  .panel-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 24px;
    box-shadow: var(--shadow-md);
    min-height: 480px;
  }
  .panel-card h2 {
    font-size: 19px; font-weight: 700; margin: 0 0 6px; color: var(--text-primary);
  }
  .panel-card .hint-text {
    font-size: 13px; color: var(--text-muted); margin-bottom: 20px;
  }

  /* Stats Cards Grid */
  .stats-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px; margin-bottom: 24px;
  }
  .stat-card {
    background: var(--bg-sub); border: 1px solid var(--border-color);
    border-radius: var(--radius-md); padding: 14px 16px;
  }
  .stat-card .val {
    font-size: 22px; font-weight: 700; color: var(--accent-sage); font-family: var(--font-mono);
  }
  .stat-card .lbl {
    font-size: 12px; color: var(--text-muted); margin-top: 2px;
  }

  /* Section Titles */
  .section-title {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    margin: 24px 0 12px; border-bottom: 2px solid var(--bg-sub); padding-bottom: 8px; flex-wrap: wrap;
  }
  .section-title h3 { font-size: 16px; font-weight: 700; margin: 0; }

  /* Calendar Grid / Columns */
  .grid-columns {
    display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px;
    -webkit-overflow-scrolling: touch;
  }
  .day-column {
    flex: 1 1 0; min-width: 160px; background: var(--bg-sub);
    border: 1px solid var(--border-color); border-radius: var(--radius-md); overflow: hidden;
  }
  .day-header {
    background: var(--accent-sage); color: #FFF; padding: 10px; text-align: center;
  }
  .day-header .d-name { font-weight: 700; font-size: 15px; }
  .day-header .d-count { font-size: 11px; opacity: 0.85; font-family: var(--font-mono); }
  .day-body { padding: 8px; display: flex; flex-direction: column; gap: 8px; min-height: 120px; }

  /* Time Slot Cards */
  .slot-card {
    border-radius: var(--radius-sm); padding: 10px; cursor: pointer;
    transition: all 0.15s ease; border: 1px solid var(--border-color);
    background: var(--bg-card); position: relative;
    -webkit-user-select: none; user-select: none;
  }
  .slot-card[draggable="true"] { cursor: grab; }
  .slot-card:active { transform: translateY(1px); }
  
  .slot-card .time { font-weight: 700; font-size: 12.5px; color: var(--text-primary); display: block; font-family: var(--font-mono); }
  .slot-card .badge { font-size: 10px; color: var(--text-muted); display: block; margin-bottom: 4px; }
  
  .slot-card.available { background: var(--accent-sage-light); border-color: #C2E0D4; }
  .slot-card.available .status { font-weight: 700; font-size: 12px; color: var(--accent-sage); }
  
  .slot-card.booked { background: var(--accent-amber-light); border-color: #FDE68A; }
  .slot-card.booked .status { font-size: 10.5px; font-weight: 700; color: var(--accent-amber); display: block; }
  .slot-card.booked .hc { font-weight: 700; font-size: 13px; color: #92400E; display: block; font-family: var(--font-mono); }
  .slot-card.booked .subj {
    font-size: 11.5px; font-weight: 600; color: #78350F; display: block;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .slot-card.booked .students {
    font-size: 10.5px; color: #A16207; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
  }
  .slot-card .price { font-size: 11px; color: var(--text-muted); display: block; margin-top: 4px; font-family: var(--font-mono); }

  .edit-time-btn {
    border: none; background: transparent; cursor: pointer; font-size: 12px;
    padding: 2px 4px; opacity: 0.55; vertical-align: middle; touch-action: manipulation;
  }
  .toggle-day-btn {
    border: none; background: transparent; cursor: pointer; font-size: 12px;
    opacity: 0.7; color: #FFF; padding: 4px 6px; touch-action: manipulation;
  }

  /* Day-jump chips: mobile only (shown via media query below) */
  .day-jump-nav {
    display: none;
  }
  .day-jump-chip {
    flex: 0 0 auto; scroll-snap-align: start; text-decoration: none;
    background: var(--bg-card); color: var(--text-secondary); font-weight: 700; font-size: 13px;
    border: 1px solid var(--border-color); border-radius: 30px; padding: 8px 14px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .day-jump-chip.closed { color: var(--text-muted); opacity: 0.6; }
  .day-jump-chip:active { background: var(--accent-sage-light); color: var(--accent-sage); }

  /* Student Mode Adjustments */
  body.student-mode .slot-card.booked { background: var(--accent-rose-light); border-color: #FECDD3; }
  body.student-mode .slot-card.booked .status { color: var(--accent-rose); }
  body.student-mode .slot-card.booked .hc,
  body.student-mode .slot-card.booked .subj,
  body.student-mode .slot-card.booked .students,
  body.student-mode .slot-card .price,
  body.student-mode .teacher-only { display: none !important; }
  body.student-mode .slot-card.booked .status::after { content: 'เต็มแล้ว'; }

  /* Monthly Calendar Minimal */
  .month-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
    background: var(--bg-sub); border-radius: var(--radius-md); padding: 10px;
  }
  .month-dow { text-align: center; font-size: 12px; font-weight: 700; color: var(--text-muted); padding: 4px 0; }
  .month-cell {
    background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-sm);
    min-height: 85px; padding: 6px; cursor: pointer; position: relative; transition: all 0.15s;
    -webkit-user-select: none; user-select: none;
  }
  .month-cell.empty { visibility: hidden; }
  .month-cell.blocked { background: var(--accent-rose-light); border-color: var(--accent-rose); }
  .month-cell .num { font-size: 13px; font-weight: 700; color: var(--text-secondary); font-family: var(--font-mono); }
  .month-cell.blocked .num { color: var(--accent-rose); }
  .month-cell .blocked-label { position: absolute; top: 4px; right: 6px; font-size: 10px; color: var(--accent-rose); font-weight: 700; }
  
  .chip-item {
    display: block; font-size: 10.5px; margin-top: 3px; padding: 2px 6px; border-radius: 4px;
    background: var(--accent-sage-light); color: var(--accent-sage); font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
  }
  .chip-item.absent { background: transparent; color: var(--accent-rose); text-decoration: line-through; border: 1px solid var(--accent-rose); }
  .chip-item.cancelled { background: transparent; color: var(--text-muted); text-decoration: line-through; border: 1px dashed var(--border-dark); }
  .chip-item.chip-more { background: var(--bg-sub); color: var(--text-secondary); font-weight: 700; border: 1px dashed var(--border-dark); }

  /* Forms & Cards Minimal */
  .form-box {
    background: var(--bg-sub); border-radius: var(--radius-md); padding: 16px;
    margin-bottom: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px;
  }
  .form-box label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
  .form-box input, .form-box select, .form-box textarea {
    width: 100%; padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-dark);
    background: var(--bg-card); font-family: inherit; font-size: 16px; color: var(--text-primary);
    -webkit-appearance: none; appearance: none;
  }
  .form-box .full-width { grid-column: 1 / -1; }

  .item-card {
    background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md);
    padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-sm);
  }
  .item-card .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .item-card .title { font-weight: 700; font-size: 15px; color: var(--text-primary); }

  .slot-row-item {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 8px 12px; border: 1px solid var(--border-color); border-radius: var(--radius-sm);
    margin-bottom: 6px; background: var(--bg-sub); font-size: 13px; flex-wrap: wrap;
  }

  /* Billing Minimal */
  .msg-textarea {
    width: 100%; min-height: 170px; padding: 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--border-dark); background: var(--bg-sub); font-family: inherit;
    font-size: 13px; line-height: 1.6; color: var(--text-primary); resize: vertical; margin-top: 8px;
  }
  .grand-box {
    display: flex; justify-content: space-between; align-items: center; background: var(--accent-sage);
    color: #FFF; padding: 18px 24px; border-radius: var(--radius-md); margin-top: 16px;
  }
  .grand-box .num { font-size: 24px; font-weight: 700; font-family: var(--font-mono); }

  /* Modal Dialog */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none;
    align-items: center; justify-content: center; z-index: 100; padding: 16px;
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  }
  .modal-backdrop.active { display: flex; }
  .modal-box {
    background: var(--bg-card); border-radius: var(--radius-lg); max-width: 440px; width: 100%;
    padding: 24px; box-shadow: var(--shadow-md); border: 1px solid var(--border-color);
  }
  .modal-box h3 { font-size: 18px; font-weight: 700; margin: 0 0 4px; color: var(--text-primary); }
  .modal-box .time-info { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }
  .modal-field { margin-bottom: 14px; }
  .modal-field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
  .modal-field input, .modal-field textarea, .modal-field select {
    width: 100%; padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-dark);
    font-family: inherit; font-size: 16px; -webkit-appearance: none; appearance: none;
  }
  .modal-btns { display: flex; gap: 8px; margin-top: 20px; }
  .modal-btns .btn { flex: 1; justify-content: center; }

  /* Toast Notification */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--text-primary); color: #FFF; padding: 8px 20px; border-radius: 30px;
    font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    z-index: 200; box-shadow: var(--shadow-md);
  }
  .toast.show { opacity: 1; }

  /* =========================================
     MOBILE RESPONSIVE (≤720px)
     ========================================= */
  @media (max-width: 720px) {
    body { padding-bottom: calc(var(--bottom-nav-h) + env(safe-area-inset-bottom, 0px) + 16px); }
    .container { padding: 16px 12px; }

    /* Header: stack title above controls, controls spread full width */
    header.app-header {
      flex-direction: column; align-items: stretch; gap: 14px; padding-bottom: 16px; margin-bottom: 16px;
    }
    .app-title h1 { font-size: 20px; }
    .app-title .subtitle { font-size: 12.5px; }
    .header-controls { justify-content: space-between; gap: 10px; }
    .month-picker { flex: 1 1 auto; justify-content: space-between; }
    .month-picker .label { min-width: 0; font-size: 13px; }
    .month-picker button { width: 34px; height: 34px; font-size: 20px; }
    .view-switch { flex: 1 1 auto; }
    .view-switch button { flex: 1 1 0; padding: 8px 6px; font-size: 12px; }

    /* Top tab bar becomes a horizontally-scrolling pill row instead of wrapping */
    nav.app-tabs {
      flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch;
      scroll-snap-type: x proximity; margin-bottom: 16px; padding-bottom: 4px;
    }
    nav.app-tabs button {
      flex: 0 0 auto; scroll-snap-align: start; white-space: nowrap; font-size: 13px; padding: 10px 16px;
    }

    /* Bottom fixed tab bar for one-thumb navigation */
    nav.app-tabs-mobile {
      display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 90;
      background: var(--bg-card); border-top: 1px solid var(--border-color);
      box-shadow: 0 -4px 16px rgba(0,0,0,0.06);
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
      height: var(--bottom-nav-h);
    }
    nav.app-tabs-mobile button {
      flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; background: none; border: none; color: var(--text-muted); font-family: inherit;
      padding: 4px 2px; border-radius: var(--radius-sm); touch-action: manipulation;
    }
    nav.app-tabs-mobile button .ic { font-size: 19px; line-height: 1; }
    nav.app-tabs-mobile button .lb { font-size: 10px; font-weight: 700; }
    nav.app-tabs-mobile button.active { color: var(--accent-sage); background: var(--accent-sage-light); }

    .panel-card { padding: 16px; border-radius: var(--radius-md); min-height: 0; }
    .panel-card h2 { font-size: 17px; }

    /* Day-jump chip nav appears above the weekly grid on mobile */
    .day-jump-nav {
      display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch;
      scroll-snap-type: x proximity; padding-bottom: 10px; margin-bottom: 4px;
    }

    /* Weekly grid: stop side-scrolling, stack each day full-width so nothing is cut off */
    .grid-columns { flex-direction: column; overflow-x: visible; gap: 14px; }
    .day-column { min-width: 100%; scroll-margin-top: 12px; }
    .day-body { padding: 10px; gap: 10px; }
    .slot-card { padding: 12px; }
    .slot-card .subj, .slot-card .students {
      white-space: normal; overflow: visible; text-overflow: unset;
    }
    .edit-time-btn, .toggle-day-btn { padding: 6px 8px; font-size: 14px; }

    /* Monthly calendar: tighten grid, allow names to wrap onto 2 lines instead of vanishing */
    .month-grid { gap: 4px; padding: 6px; }
    .month-cell { min-height: 74px; padding: 4px; }
    .month-dow { font-size: 10.5px; padding: 2px 0; }
    .chip-item {
      font-size: 9.5px; padding: 2px 4px; white-space: normal; overflow: visible;
      text-overflow: unset; display: block; line-height: 1.25;
    }

    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .grand-box { flex-direction: column; align-items: flex-start; gap: 6px; }

    /* Modal: fill more of the screen, keep controls reachable */
    .modal-box { max-width: 100%; padding: 20px; }
    .modal-btns { flex-wrap: wrap; }
    .modal-btns .btn { flex: 1 1 100%; }

    .form-box { grid-template-columns: 1fr; }
  }

  @media print {
    .header-controls, nav.app-tabs, nav.app-tabs-mobile, .btn, .stats-grid { display: none !important; }
    body { background: #fff !important; }
    .panel-card { box-shadow: none; border: none; padding: 0; }
  }
</style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <header class="app-header">
    <div class="app-title">
      <h1>ตารางสอน & ระบบบัญชีติวเตอร์</h1>
      <div class="subtitle">มินิมอล ใช้งานง่าย · จัดตารางง่าย · คิดเงินอัตโนมัติ</div>
    </div>

    <div class="header-controls">
      <div class="month-picker">
        <button id="prevMonthBtn" type="button">‹</button>
        <div class="label" id="monthDisplay">สิงหาคม 2569</div>
        <button id="nextMonthBtn" type="button">›</button>
      </div>

      <div class="view-switch">
        <button id="modeTeacherBtn" class="active" type="button">มุมมองครู</button>
        <button id="modeStudentBtn" type="button">มุมมองนักเรียน</button>
      </div>
    </div>
  </header>

// Defensive Utilities for Safari
function pad(n) { return String(n).padStart(2, '0'); }
function dateStr(y, m, d) { return `${y}-${pad(m+1)}-${pad(d)}`; }
function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
function money(n) { return (Number(n) || 0).toLocaleString('th-TH'); }
function ymOf(y, m) { return `${y}-${pad(m+1)}`; }
function currentYM() { return ymOf(view.y, view.m); }
function prevYM() { let y = view.y, m = view.m - 1; if(m < 0){ m = 11; y--; } return ymOf(y, m); }
function escapeHtml(str) { return String(str || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

function showToast(msg) {
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function safeGetStorage(key) {
  try { return localStorage.getItem(key); } catch(e) { return null; }
}
function safeSetStorage(key, value) {
  try { localStorage.setItem(key, value); return true; } catch(e) { return false; }
}

function loadState() {
  const raw = safeGetStorage(STORAGE_KEY);
  if(raw) {
    try { S = { ...S, ...JSON.parse(raw) }; } catch(e) {}
  }
}
function saveState() {
  safeSetStorage(STORAGE_KEY, JSON.stringify(S));
}

function updateHeader() {
  const el = document.getElementById('monthDisplay');
  if(el) el.textContent = `${TH_MONTHS[view.m]} ${view.y + 543}`;
}

// Initialization Entry Point (Safe DOM Ready)
function initApp() {
  loadState();
  updateHeader();

  const prevBtn = document.getElementById('prevMonthBtn');
  if(prevBtn) {
    prevBtn.addEventListener('click', () => {
      view.m--; if(view.m < 0) { view.m = 11; view.y--; }
      updateHeader(); render();
    });
  }

  const nextBtn = document.getElementById('nextMonthBtn');
  if(nextBtn) {
    nextBtn.addEventListener('click', () => {
      view.m++; if(view.m > 11) { view.m = 0; view.y++; }
      updateHeader(); render();
    });
  }

  const modeT = document.getElementById('modeTeacherBtn');
  if(modeT) modeT.addEventListener('click', () => setMode('teacher'));

  const modeS = document.getElementById('modeStudentBtn');
  if(modeS) modeS.addEventListener('click', () => setMode('student'));

  document.querySelectorAll('[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      view.tab = btn.dataset.tab;
      document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === view.tab));
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    });
  });

  const slotCancel = document.getElementById('slotModalCancel');
  if(slotCancel) slotCancel.addEventListener('click', closeSlotModal);

  const slotClear = document.getElementById('slotModalClear');
  if(slotClear) slotClear.addEventListener('click', clearSlotBooking);

  const slotSave = document.getElementById('slotModalSave');
  if(slotSave) slotSave.addEventListener('click', saveSlotBooking);

  const slotNames = document.getElementById('slotModalNames');
  if(slotNames) {
    slotNames.addEventListener('input', (e) => {
      const lines = e.target.value.split('\n').map(s => s.trim()).filter(Boolean);
      const hc = document.getElementById('slotModalHeadcount');
      if(hc) hc.value = lines.length || '';
    });
  }

  const customCancel = document.getElementById('customSlotCancel');
  if(customCancel) customCancel.addEventListener('click', closeCustomSlotModal);

  const customSave = document.getElementById('customSlotSave');
  if(customSave) customSave.addEventListener('click', saveCustomSlot);

  const customReset = document.getElementById('customSlotReset');
  if(customReset) customReset.addEventListener('click', resetCustomSlotTime);

  render();
}

if(document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}

// Register service worker so the app is installable and works offline.
if('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch((err) => {
      console.warn('Service worker registration failed:', err);
    });
  });
}

function setMode(m) {
  view.mode = m;
  document.body.classList.toggle('student-mode', m === 'student');
  const tBtn = document.getElementById('modeTeacherBtn');
  const sBtn = document.getElementById('modeStudentBtn');
  if(tBtn) tBtn.classList.toggle('active', m === 'teacher');
  if(sBtn) sBtn.classList.toggle('active', m === 'student');
  render();
}

// Render Controller
function render() {
  const panel = document.getElementById('mainPanel');
  if(!panel) return;
  if(view.tab === 'weekly') renderWeeklyTab(panel);
  else if(view.tab === 'monthly') renderMonthlyTab(panel);
  else if(view.tab === 'students') renderStudentsTab(panel);
  else if(view.tab === 'billing') renderBillingTab(panel);
  else if(view.tab === 'export') renderExportTab(panel);

  attachDragAndDrop();
}

const weekdayDays = [{ key:'mon', label:'จันทร์' }, { key:'tue', label:'อังคาร' }, { key:'wed', label:'พุธ' }, { key:'thu', label:'พฤหัสฯ' }, { key:'fri', label:'ศุกร์' }];
const weekendDays = [{ key:'sat', label:'เสาร์' }, { key:'sun', label:'อาทิตย์' }];

function slotKey(section, dayKey, idx) { return `${section}-${dayKey}-${idx}`; }
function getBooking(section, dayKey, idx) { return S.bookings[slotKey(section, dayKey, idx)] || null; }
function getSlotTime(section, dayKey, idx) {
  const key = slotKey(section, dayKey, idx);
  const override = (S.timeOverrides || {})[key];
  return override || S.weeklySlots[section][idx].t;
}
function isDayClosed(dayKey) { return (S.closedDays || []).includes(dayKey); }
function toggleDayClosed(dayKey) {
  if(!S.closedDays) S.closedDays = [];
  const i = S.closedDays.indexOf(dayKey);
  if(i >= 0) S.closedDays.splice(i, 1); else S.closedDays.push(dayKey);
  saveState(); render(); showToast(i >= 0 ? 'เปิดวันนี้แล้ว' : 'ตั้งเป็นวันหยุดแล้ว');
}

function renderWeeklyTab(panel) {
  let totalBooked = 0, weekdayTargetMet = 0, estRevenue = 0;

  weekdayDays.forEach(day => {
    if(isDayClosed(day.key)) return;
    let dayCount = 0;
    S.weeklySlots.weekday.forEach((slot, idx) => {
      const b = getBooking('weekday', day.key, idx);
      if(b && b.status === 'booked') {
        totalBooked++; dayCount++;
        const hc = b.headcount || (b.names || []).length || 1;
        const rate = (b.customPrice !== undefined && b.customPrice !== null && b.customPrice !== '') ? Number(b.customPrice) : S.settings.defaultRate;
        if(!slot.flex) estRevenue += hc * rate;
      }
    });
    if(dayCount >= 3) weekdayTargetMet++;

        const rate = (b.customPrice !== undefined && b.customPrice !== null && b.customPrice !== '') ? Number(b.customPrice) : S.settings.defaultRate;

  panel.innerHTML = `

        <div class="lbl">คาบเรียนที่จองในสัปดาห์</div>
      </div>

        <div class="val">${weekdayTargetMet}/5 วัน</div>
        <div class="lbl">วันธรรมดาตามเป้า (≥3 คาบ)</div>
      </div>
      <div class="stat-card">
        <div class="val">${money(estRevenue)} บาท</div>
        <div class="lbl">รายได้ประมาณการ / สัปดาห์</div>
      </div>
    </div>

    <div class="teacher-only" style="margin-bottom:16px; background:var(--bg-sub); padding:10px 14px; border-radius:var(--radius-sm); font-size:13px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <div>
        ⚙️ ราคาตั้งต้น: 
        <input type="number" id="defaultRateInput" value="${S.settings.defaultRate}" style="width:80px; padding:6px 8px; border-radius:4px; border:1px solid var(--border-dark); font-weight:700; font-size:16px; font-family:var(--font-mono);"> บาท/คน/คาบ
      </div>
      <div style="color:var(--text-muted); font-size:12px;">💡 ลากและวาง (Drag & Drop) เพื่อสลับคาบเรียนได้</div>

    <nav class="day-jump-nav">
      ${weekdayDays.concat(weekendDays).map(d => `<a href="#day-${d.key}" class="day-jump-chip ${isDayClosed(d.key) ? 'closed' : ''}">${d.label}</a>`).join('')}

    <div class="section-title">

      <button class="btn small primary teacher-only" id="addWeekdaySlotBtn" type="button">+ เพิ่มช่วงเวลา</button>

function renderDayCols(section, days, slots) {
  return days.map(day => {
    if(isDayClosed(day.key)) {
      return `
        <div class="day-column" id="day-${day.key}">
          <div class="day-header">
            <div class="d-name">${day.label}</div>
            <button class="toggle-day-btn teacher-only" data-day="${day.key}" type="button" title="เปิดวันนี้">🔓 เปิดวัน</button>
          </div>
          <div class="day-body" style="display:flex; align-items:center; justify-content:center; min-height:120px; text-align:center; color:var(--text-muted); font-size:13px; padding:20px 8px;">
            😴 วันหยุด (พัก)
          </div>
        </div>
      `;
    }

    let bookedCount = 0;
    slots.forEach((slot, idx) => {
      const b = getBooking(section, day.key, idx);
      if(b && b.status === 'booked') bookedCount++;
    });

    const cards = slots.map((slot, idx) => {
      const b = getBooking(section, day.key, idx);
      const isBooked = b && b.status === 'booked';
      const key = slotKey(section, day.key, idx);
      const displayTime = getSlotTime(section, day.key, idx);
      const rate = (b && b.customPrice !== undefined && b.customPrice !== null && b.customPrice !== '') ? Number(b.customPrice) : S.settings.defaultRate;
      const hc = isBooked ? (b.headcount || (b.names||[]).length || 1) : 0;

      return `
        <div class="slot-card ${isBooked ? 'booked' : 'available'}"
             draggable="${isBooked ? 'true' : 'false'}"
             data-key="${key}" data-section="${section}" data-day="${day.key}" data-idx="${idx}"
             data-daylabel="${escapeHtml(day.label)}" data-timelabel="${escapeHtml(displayTime)}">
          <span class="time">${displayTime}<button class="edit-time-btn teacher-only" data-section="${section}" data-day="${day.key}" data-idx="${idx}" type="button" title="แก้ไขเวลา (เฉพาะวันนี้)">✏️</button></span>
          ${slot.d ? `<span class="badge">${slot.d}</span>` : ''}
          ${isBooked ? `
            <span class="status">จองแล้ว</span>
            <span class="hc">${hc} คน</span>
            ${b.subject ? `<span class="subj">${escapeHtml(b.subject)}</span>` : ''}
            ${(b.names && b.names.length) ? `<span class="students">👤 ${escapeHtml(b.names.join(', '))}</span>` : ''}
            <span class="price">${slot.flex ? 'ยืดหยุ่น' : money(hc * rate) + ' บาท'}</span>
          ` : `
            <span class="status">ว่าง</span>
            <span class="price">${slot.flex ? 'สำรอง' : rate + ' บาท/คน'}</span>
          `}
        </div>
      `;
    }).join('');

    return `
      <div class="day-column" id="day-${day.key}">
        <div class="day-header">
          <div class="d-name">${day.label}</div>
          <div class="d-count">${bookedCount}/${slots.length} คาบ</div>
          <button class="toggle-day-btn teacher-only" data-day="${day.key}" type="button" title="ตั้งเป็นวันหยุด">🌙</button>
        </div>
        <div class="day-body">
          ${cards}
        </div>
      </div>
    `;
  }).join('');
}

// Modal Handlers
function openSlotModal(section, dayKey, idx, dayLabel, timeLabel) {
  view.activeSlot = { section, dayKey, idx };
  const b = getBooking(section, dayKey, idx) || {};
  const labelEl = document.getElementById('slotModalTimeLabel');
  if(labelEl) labelEl.textContent = `${dayLabel} · ${timeLabel}`;
  
  const subjEl = document.getElementById('slotModalSubject');
  if(subjEl) subjEl.value = b.subject || '';

  const namesEl = document.getElementById('slotModalNames');
  if(namesEl) namesEl.value = (b.names || []).join('\n');

  const hcEl = document.getElementById('slotModalHeadcount');
  if(hcEl) hcEl.value = b.headcount || (b.names||[]).length || '';

  const priceEl = document.getElementById('slotModalPrice');
  if(priceEl) priceEl.value = b.customPrice !== undefined && b.customPrice !== null ? b.customPrice : '';

  const modal = document.getElementById('slotModal');
  if(modal) modal.classList.add('active');
}

function closeSlotModal() {
  const modal = document.getElementById('slotModal');
  if(modal) modal.classList.remove('active');
  view.activeSlot = null;
}

function saveSlotBooking() {
  if(!view.activeSlot) return;
  const { section, dayKey, idx } = view.activeSlot;
  const subject = (document.getElementById('slotModalSubject')?.value || '').trim();
  const names = (document.getElementById('slotModalNames')?.value || '').split('\n').map(s => s.trim()).filter(Boolean);
  const headcount = Number(document.getElementById('slotModalHeadcount')?.value) || names.length;
  const customPrice = document.getElementById('slotModalPrice')?.value;

  const key = slotKey(section, dayKey, idx);
  if(headcount <= 0 && names.length === 0 && !subject) {
    delete S.bookings[key];
  } else {
    S.bookings[key] = {
      status: 'booked',
      subject, names,
      headcount: headcount || names.length || 1,
      customPrice: (customPrice !== undefined && customPrice !== '') ? Number(customPrice) : null
    };
  }
  saveState(); render(); closeSlotModal(); showToast('บันทึกคาบเรียนแล้ว');
}

function clearSlotBooking() {
  if(!view.activeSlot) return;
  const { section, dayKey, idx } = view.activeSlot;
  delete S.bookings[slotKey(section, dayKey, idx)];
  saveState(); render(); closeSlotModal(); showToast('ล้างช่องแล้ว');
}

function openCustomSlotModal(section) {
  const modal = document.getElementById('customSlotModal');
  if(modal) { modal.dataset.mode = 'add'; delete modal.dataset.editIdx; delete modal.dataset.editDay; modal.classList.add('active'); }

  const titleEl = document.getElementById('customSlotTitle');
  if(titleEl) titleEl.textContent = 'เพิ่มช่วงเวลาเรียนใหม่';

  const secEl = document.getElementById('customSlotSection');
  if(secEl) { secEl.value = section; secEl.disabled = false; }

  const timeEl = document.getElementById('customSlotTime');
  if(timeEl) timeEl.value = '';

  const resetBtn = document.getElementById('customSlotReset');
  if(resetBtn) resetBtn.style.display = 'none';

  const saveBtn = document.getElementById('customSlotSave');
  if(saveBtn) saveBtn.textContent = 'เพิ่มช่วงเวลา';
}

function openEditSlotTimeModal(section, dayKey, idx) {
  const currentTime = getSlotTime(section, dayKey, idx);
  const dayObj = (section === 'weekday' ? weekdayDays : weekendDays).find(d => d.key === dayKey);
  const dayLabel = dayObj ? dayObj.label : '';

  const modal = document.getElementById('customSlotModal');
  if(modal) { modal.dataset.mode = 'edit'; modal.dataset.editSection = section; modal.dataset.editDay = dayKey; modal.dataset.editIdx = idx; modal.classList.add('active'); }

  const titleEl = document.getElementById('customSlotTitle');
  if(titleEl) titleEl.textContent = `แก้ไขเวลาเรียน (เฉพาะวัน${dayLabel})`;

  const secEl = document.getElementById('customSlotSection');
  if(secEl) { secEl.value = section; secEl.disabled = true; }

  const timeEl = document.getElementById('customSlotTime');
  if(timeEl) timeEl.value = currentTime;

  const resetBtn = document.getElementById('customSlotReset');
  if(resetBtn) resetBtn.style.display = (S.timeOverrides || {})[slotKey(section, dayKey, idx)] ? 'inline-block' : 'none';

  const saveBtn = document.getElementById('customSlotSave');
  if(saveBtn) saveBtn.textContent = 'บันทึกเวลา';
}

function closeCustomSlotModal() {
  const modal = document.getElementById('customSlotModal');
  if(modal) modal.classList.remove('active');
  const secEl = document.getElementById('customSlotSection');
  if(secEl) secEl.disabled = false;
}

function saveCustomSlot() {
  const modal = document.getElementById('customSlotModal');
  const mode = modal?.dataset.mode || 'add';
  const t = (document.getElementById('customSlotTime')?.value || '').trim();
  if(!t) { alert('กรุณากรอกเวลาเรียน'); return; }

  if(mode === 'edit') {
    const section = modal.dataset.editSection;
    const dayKey = modal.dataset.editDay;
    const idx = Number(modal.dataset.editIdx);
    if(!S.timeOverrides) S.timeOverrides = {};
    S.timeOverrides[slotKey(section, dayKey, idx)] = t;
    saveState(); render(); closeCustomSlotModal(); showToast('แก้ไขเวลาเฉพาะวันนี้แล้ว');
  } else {
    const section = document.getElementById('customSlotSection')?.value || 'weekday';
    S.weeklySlots[section].push({ t });
    saveState(); render(); closeCustomSlotModal(); showToast('เพิ่มช่วงเวลาแล้ว');
  }
}

function resetCustomSlotTime() {
  const modal = document.getElementById('customSlotModal');
  if(!modal || modal.dataset.mode !== 'edit') return;
  const section = modal.dataset.editSection;
  const dayKey = modal.dataset.editDay;
  const idx = Number(modal.dataset.editIdx);
  if(S.timeOverrides) delete S.timeOverrides[slotKey(section, dayKey, idx)];
  saveState(); render(); closeCustomSlotModal(); showToast('รีเซ็ตเป็นเวลาเริ่มต้นแล้ว');
}

// Drag & Drop
let draggedKey = null;
function attachDragAndDrop() {
  document.querySelectorAll('.slot-card[draggable="true"]').forEach(card => {
    card.addEventListener('dragstart', () => { draggedKey = card.dataset.key; });
  });

  document.querySelectorAll('.slot-card').forEach(target => {
    target.addEventListener('dragover', (e) => { e.preventDefault(); target.style.opacity = '0.7'; });
    target.addEventListener('dragleave', () => { target.style.opacity = '1'; });
    target.addEventListener('drop', (e) => {
      e.preventDefault();
      target.style.opacity = '1';
      const targetKey = target.dataset.key;
      if(draggedKey && targetKey && draggedKey !== targetKey) {
        const temp = S.bookings[draggedKey];
        S.bookings[draggedKey] = S.bookings[targetKey];
        S.bookings[targetKey] = temp;
        if(!S.bookings[draggedKey]) delete S.bookings[draggedKey];
        if(!S.bookings[targetKey]) delete S.bookings[targetKey];
        saveState(); render(); showToast('สลับคาบเรียนแล้ว');
      }
    });
  });
}

/* =========================================
   TAB 2: MONTHLY CALENDAR
   ========================================= */
function isBlocked(ds) { return S.blocked.some(b => b.date === ds); }
function isAbsent(studentId, ds) { return S.absences.some(a => a.studentId === studentId && a.date === ds); }
function slotsForMonth(ym) { return S.schedules.filter(sc => sc.yearMonth === ym); }

function renderMonthlyTab(panel) {
  const ym = currentYM();
  const nd = daysInMonth(view.y, view.m);
  const firstDow = new Date(view.y, view.m, 1).getDay();
  const monthSlots = slotsForMonth(ym);
  if(!view.expandedDates) view.expandedDates = [];

  let cells = '';
  for(let i = 0; i < firstDow; i++) cells += `<div class="month-cell empty"></div>`;

  for(let d = 1; d <= nd; d++) {
    const dow = new Date(view.y, view.m, d).getDay();
    const ds = dateStr(view.y, view.m, d);
    const blocked = isBlocked(ds);
    const daySlots = monthSlots.filter(sc => sc.day === dow);
    const isExpanded = view.expandedDates.includes(ds);
    const CHIP_LIMIT = 3;
    const visibleSlots = isExpanded ? daySlots : daySlots.slice(0, CHIP_LIMIT);
    const hiddenCount = daySlots.length - visibleSlots.length;

    let chips = visibleSlots.map(sc => {
      const student = S.students.find(s => s.id === sc.studentId);
      if(!student) return '';
      const absent = isAbsent(sc.studentId, ds);
      let cls = 'chip-item';
      if(blocked) cls += ' cancelled'; else if(absent) cls += ' absent';

      return `<span class="${cls}" data-studentid="${sc.studentId}" data-ds="${ds}">${escapeHtml(student.name)}</span>`;
    }).join('');

    if(hiddenCount > 0) {
      chips += `<span class="chip-item chip-more" data-ds="${ds}">+${hiddenCount} เพิ่มเติม</span>`;
    } else if(isExpanded && daySlots.length > CHIP_LIMIT) {
      chips += `<span class="chip-item chip-more" data-ds="${ds}">ย่อ</span>`;
    }

    cells += `
      <div class="month-cell ${blocked ? 'blocked' : ''}" data-ds="${ds}">
        <div class="num">${d}</div>
        ${blocked ? '<div class="blocked-label">ติดธุระ</div>' : ''}
        ${chips}
      </div>
    `;
  }

  panel.innerHTML = `
    <h2>ปฏิทินเดือน ${TH_MONTHS[view.m]} ${view.y + 543}</h2>
    <div class="hint-text">
      👉 คลิกที่ <b>กล่องวันที่</b> เพื่อบล็อก/ยกเลิกทั้งวัน (ติดธุระ)<br>
      👉 คลิกที่ <b>ชิปชื่อนักเรียน</b> เพื่อสลับสถานะลาเรียนของนักเรียนคนนั้น
    </div>

    <div class="month-grid">
      ${DOW_SHORT.map(d => `<div class="month-dow">${d}</div>`).join('')}
      ${cells}
    </div>
  `;

  panel.querySelectorAll('.month-cell').forEach(cell => {
    cell.addEventListener('click', (e) => {
      if(e.target.classList.contains('chip-more')) {
        e.stopPropagation();
        const ds = e.target.dataset.ds;
        const i = view.expandedDates.indexOf(ds);
        if(i >= 0) view.expandedDates.splice(i, 1); else view.expandedDates.push(ds);
        render();
      } else if(e.target.classList.contains('chip-item')) {
        e.stopPropagation();
        const sid = e.target.dataset.studentid;
        const ds = e.target.dataset.ds;
        toggleAbsence(sid, ds);
      } else {
        const ds = cell.dataset.ds;
        if(ds) toggleBlock(ds);
      }
    });
  });
}

function toggleBlock(ds) {
  const idx = S.blocked.findIndex(b => b.date === ds);
  if(idx >= 0) S.blocked.splice(idx, 1);
  else S.blocked.push({ date: ds });
  saveState(); render();
}

function toggleAbsence(studentId, ds) {
  const idx = S.absences.findIndex(a => a.studentId === studentId && a.date === ds);
  if(idx >= 0) S.absences.splice(idx, 1);
  else S.absences.push({ id: Date.now() + Math.random(), studentId, date: ds });
  saveState(); render();
}

/* =========================================
   TAB 4: BILLING & CALCULATIONS
   ========================================= */
function sessionsForSlot(slot, y, m) {
  const out = [];
  const nd = daysInMonth(y, m);
  for(let d = 1; d <= nd; d++) {
    const dow = new Date(y, m, d).getDay();
    if(dow === slot.day) {
      const ds = dateStr(y, m, d);
      out.push({ day: d, ds, held: !isBlocked(ds) && !isAbsent(slot.studentId, ds) });
    }
  }
  return out;
}

function buildMessage(student, slots) {
  let lines = [];
  let total = 0;

  slots.forEach(slot => {
    const sessions = sessionsForSlot(slot, view.y, view.m);
    const held = sessions.filter(x => x.held);
    const subtotal = held.length * slot.price;
    total += subtotal;
    const dateList = held.map(x => x.day).join(', ') || '-';
    lines.push(`🗓️ วัน${DOW_NAMES[slot.day]}: วันที่ ${dateList} (${held.length} ครั้ง)
• เวลาเรียน: ${slot.time} น.
• ยอดรวม: ${held.length} ครั้ง × ${money(slot.price)} บาท = ${money(subtotal)} บาท`);
  });

  return `สวัสดีครับ${student.parentTitle}
ขออนุญาตแจ้งสรุปค่าเรียนพิเศษของน้อง (${student.name}) นะครับ

📌 ตารางเรียน (${student.name}) – (${TH_MONTHS[view.m]} ${view.y + 543})

${lines.join('\n\n')}

✅ ยอดรวมสุทธิ: ${money(total)} บาท

ขอบคุณครับ 🙏`;
}

function renderBillingTab(panel) {
  const ym = currentYM();
  const activeStudents = S.students.filter(s => slotsForStudentMonth(s.id, ym).length > 0);

  if(activeStudents.length === 0) {
    panel.innerHTML = `<h2>สรุปค่าเรียน & แจ้งผู้ปกครอง</h2><div style="padding:20px; text-align:center; color:var(--text-muted);">ยังไม่มีตารางเรียนในเดือนนี้ (ไปที่แท็บ "นักเรียน & คลาสเรียน" เพื่อเพิ่มตารางเรียน)</div>`;
    return;
  }

  let grandTotal = 0;
  const cards = activeStudents.map(s => {
    const slots = slotsForStudentMonth(s.id, ym);
    let studentTotal = 0, heldCount = 0;

    slots.forEach(slot => {
      const held = sessionsForSlot(slot, view.y, view.m).filter(x => x.held);
      studentTotal += held.length * slot.price;
      heldCount += held.length;
    });
    grandTotal += studentTotal;

    const msg = buildMessage(s, slots);
    const msgId = 'msg_' + s.id;

    return `
      <div class="item-card">
        <div class="head">
          <div class="title">👤 ${escapeHtml(s.name)} (${heldCount} ครั้งรวม)</div>
          <div style="font-size:16px; font-weight:700; color:var(--accent-sage);">${money(studentTotal)} บาท</div>
        </div>
        <textarea id="${msgId}" class="msg-textarea">${msg}</textarea>
        <div style="margin-top:10px;">
          <button class="btn primary small copy-msg-btn" data-target="${msgId}" type="button">📋 คัดลอกข้อความแจ้งผู้ปกครอง</button>
        </div>
      </div>
    `;
  }).join('');

  panel.innerHTML = `
    <h2>สรุปค่าเรียน & แจ้งผู้ปกครอง — ${TH_MONTHS[view.m]} ${view.y + 543}</h2>
    <div class="hint-text">คำนวณวันเรียนจริงโดยหักวันติดธุระและวันลาเรียบร้อยแล้ว</div>
    ${cards}
    
    <div class="grand-box">
      <div>💰 ยอดรวมรายได้สุทธิเดือนนี้</div>
      <div class="num">${money(grandTotal)} บาท</div>
    </div>
  `;

  panel.querySelectorAll('.copy-msg-btn').forEach(b => {
    b.addEventListener('click', () => {
      const el = document.getElementById(b.dataset.target);
      if(el) {
        el.select();
        try {
          navigator.clipboard.writeText(el.value).then(() => showToast('คัดลอกข้อความแล้ว')).catch(() => {
            document.execCommand('copy'); showToast('คัดลอกข้อความแล้ว');
          });
        } catch(e) {
          document.execCommand('copy'); showToast('คัดลอกข้อความแล้ว');
        }
      }
    });
  });
}

      <div class="item-card">
        <div class="title">🖼️ บันทึกเป็นรูปภาพ (PNG)</div>
        <p style="font-size:12.5px; color:var(--text-muted);">สร้างรูปภาพตารางสอนสัปดาห์ปัจจุบันสำหรับส่งแชท</p>
        <button class="btn primary" id="exportImgBtn" type="button">📸 ดาวน์โหลดรูปภาพ</button>
      </div>

      <div class="item-card">
        <div class="title">📊 ส่งออกตารางเรียน (CSV)</div>
        <p style="font-size:12.5px; color:var(--text-muted);">ไฟล์ CSV สำหรับเปิดใน Microsoft Excel หรือ Google Sheets</p>
        <div style="display:flex; gap:6px; flex-wrap:wrap;">
          <button class="btn small" id="exportCsvTeacherBtn" type="button">CSV ฉบับครู</button>
          <button class="btn small" id="exportCsvStudentBtn" type="button">CSV ฉบับนักเรียน</button>
        </div>
      </div>

      <div class="item-card">
        <div class="title">🌐 บันทึกไฟล์ HTML</div>
        <p style="font-size:12.5px; color:var(--text-muted);">ดาวน์โหลดไฟล์ HTML กลับลงเครื่อง</p>
        <button class="btn" id="exportHtmlBtn" type="button">📥 ดาวน์โหลด HTML</button>
      </div>

      <div class="item-card">
        <div class="title">📦 สำรองข้อมูล (JSON)</div>
        <p style="font-size:12.5px; color:var(--text-muted);">สำรองหรือนำเข้าข้อมูลทั้งหมด</p>
        <div style="display:flex; gap:6px; flex-wrap:wrap;">
          <button class="btn small" id="backupJsonBtn" type="button">💾 สำรองข้อมูล</button>
          <button class="btn small" id="restoreJsonBtn" type="button">📤 นำเข้าข้อมูล</button>
          <input type="file" id="jsonFileInput" accept=".json" style="display:none;">
        </div>
      </div>

      <div class="item-card" style="grid-column: 1 / -1;">
        <div class="title">🖨️ พิมพ์เอกสาร / Save as PDF</div>
        <p style="font-size:12.5px; color:var(--text-muted);">พิมพ์ตารางสอนผ่านเครื่องพิมพ์หรือบันทึกเป็น PDF</p>
        <button class="btn primary" id="printBtn" type="button">🖨️ พิมพ์ตารางสอน</button>
      </div>

    </div>

    <div style="margin-top:30px; text-align:center;">
      <button class="btn danger" id="resetAllBtn" type="button">⚠️ ล้างข้อมูลทั้งหมด</button>
    </div>
  `;

  const imgBtn = document.getElementById('exportImgBtn');
  if(imgBtn) {
    imgBtn.addEventListener('click', () => {
      showToast('กำลังประมวลผลรูปภาพ...');
      if(view.tab !== 'weekly') { view.tab = 'weekly'; render(); }
      setTimeout(() => {
        if(window.html2canvas) {
          html2canvas(document.querySelector('.container'), { scale: 2 }).then(canvas => {
            const a = document.createElement('a');
            a.download = `ตารางสอน_${TH_MONTHS[view.m]}_${view.y+543}.png`;
            a.href = canvas.toDataURL('image/png');
            a.click(); showToast('ดาวน์โหลดรูปภาพแล้ว');
          });
        } else {
          alert('ระบบไม่พบไลบรารีสร้างรูปภาพ กรุณาใช้ปุ่มพิมพ์/Save PDF');
        }
      }, 300);
    });
  }

  const csvTeacherBtn = document.getElementById('exportCsvTeacherBtn');
  if(csvTeacherBtn) csvTeacherBtn.addEventListener('click', () => exportCSV(true));

  const csvStudentBtn = document.getElementById('exportCsvStudentBtn');
  if(csvStudentBtn) csvStudentBtn.addEventListener('click', () => exportCSV(false));

  const htmlBtn = document.getElementById('exportHtmlBtn');
  if(htmlBtn) htmlBtn.addEventListener('click', downloadHtmlFile);

  const backupBtn = document.getElementById('backupJsonBtn');
  if(backupBtn) backupBtn.addEventListener('click', exportBackupJSON);

  const restoreBtn = document.getElementById('restoreJsonBtn');
  const fileInput = document.getElementById('jsonFileInput');
  if(restoreBtn && fileInput) {
    restoreBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', importBackupJSON);
  }

  const printBtn = document.getElementById('printBtn');
  if(printBtn) printBtn.addEventListener('click', () => window.print());

  const resetBtn = document.getElementById('resetAllBtn');
  if(resetBtn) resetBtn.addEventListener('click', resetAllData);
}

function exportCSV(isTeacher) {
  const headers = isTeacher ? ['ช่วงวัน','วัน','เวลา','สถานะ','วิชา','รายชื่อนักเรียน','จำนวนคน','รายได้'] : ['ช่วงวัน','วัน','เวลา','สถานะ'];
  const lines = [headers.join(',')];

  const buildRows = (section, days, slots) => {
    days.forEach(day => {
      slots.forEach((slot, idx) => {
        const b = getBooking(section, day.key, idx);
        const isBooked = b && b.status === 'booked';
        const hc = isBooked ? (b.headcount || (b.names||[]).length || 1) : 0;
        const rate = (b && b.customPrice) ? Number(b.customPrice) : S.settings.defaultRate;
        const rev = (isBooked && !slot.flex) ? hc * rate : 0;

        const row = isTeacher
          ? [section==='weekday'?'วันธรรมดา':'เสาร์-อาทิตย์', day.label, slot.t, isBooked?'จองแล้ว':'ว่าง', b?b.subject||'':'', (b&&b.names)?b.names.join('/'):'', hc, rev]
          : [section==='weekday'?'วันธรรมดา':'เสาร์-อาทิตย์', day.label, slot.t, isBooked?'จองแล้ว':'ว่าง'];
        lines.push(row.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(','));
      });
    });
  };

  buildRows('weekday', weekdayDays, S.weeklySlots.weekday);
  buildRows('weekend', weekendDays, S.weeklySlots.weekend);

  const blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = isTeacher ? 'ตารางสอน_ฉบับครู.csv' : 'ตารางสอน_ฉบับนักเรียน.csv';
  a.click(); showToast('ดาวน์โหลด CSV เรียบร้อย');
}

function downloadHtmlFile() {
  const htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8;' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'planner_manager_upgraded.html';
  a.click(); showToast('ดาวน์โหลดไฟล์ HTML แล้ว');
}

function exportBackupJSON() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `tutor_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click(); showToast('สำรองข้อมูลเรียบร้อย');
}

function importBackupJSON(e) {
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      S = JSON.parse(evt.target.result);
      saveState(); render(); showToast('นำเข้าข้อมูลสำเร็จ');
    } catch(err) { alert('ไฟล์ JSON ไม่ถูกต้อง'); }
  };
  reader.readAsText(file);
}

function resetAllData() {
  if(!confirm('ล้างข้อมูลทั้งหมดในระบบ?')) return;
  S = {
    settings: { defaultRate: 300 },
    students: [],
    weeklySlots: {
      weekday: [{ t: '16:30–18:00' }, { t: '18:15–19:45' }, { t: '20:00–21:30' }, { t: '21:30–22:30', flex: true, d: 'คาบสำรอง' }],
      weekend: [{ t: '09:00–10:30' }, { t: '10:45–12:15' }, { t: '13:00–14:30', d: 'หลังพักเที่ยง' }, { t: '14:45–16:15' }, { t: '16:30–18:00' }, { t: '18:15–19:45' }, { t: '19:45–20:30', flex: true, d: 'คาบสำรอง' }]
    },
    bookings: {}, schedules: [], blocked: [], absences: []
  };
  saveState(); render(); showToast('ล้างข้อมูลเรียบร้อย');
}
</script>
